
<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiếng Anh 4 Global Success</title>
<style>

*{box-sizing:border-box}body{font-family:Segoe UI,sans-serif;background:#eef5fb;max-width:80%;margin:auto;padding:20px}
h1{

    text-align:center;

    margin-bottom:30px;

    color:#1565C0;

    font-size:42px;

    font-weight:800;

}

h1 span{

    font-size:46px;

    margin-right:8px;

}

h1 small{

    display:block;

    margin-top:6px;

    font-size:22px;

    color:#64B5F6;

    font-weight:600;

}
.top{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.top button{

    padding:14px 24px;

    border:none;

    border-radius:40px;

    background:linear-gradient(135deg,#ff9800,#f57c00);

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 6px 18px rgba(255,152,0,.35);

}
.top button:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 25px rgba(255,152,0,.45);

}
.top button:active{

    transform:scale(.95);

}
.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.12)}
label{display:block;margin:12px 0 6px;font-weight:bold}
select{

    width:100%;

    padding:14px;

    font-size:16px;

    border:2px solid #BBDEFB;

    border-radius:12px;

    background:white;

    transition:.25s;

}
select:focus{

    border-color:#2196F3;

    outline:none;

    box-shadow:0 0 0 4px rgba(33,150,243,.15);

}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:18px}
.buttons{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:12px;
    margin-top:20px;
}

.buttons button{

    width:100%;

    min-height:60px;

    padding:15px 18px;

    border:none;

    border-radius:12px;

    background:linear-gradient(135deg,#42A5F5,#1E88E5);

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    text-align:left;

    transition:.25s;

    display:flex;

    align-items:center;

}
.buttons button:hover{

    background:linear-gradient(135deg,#64B5F6,#2196F3);

    box-shadow:0 10px 22px rgba(30,136,229,.30);

}

.buttons button:active{

    transform:scale(.97);

}

#videoBtn{

    display:block;

    width:100%;

    margin:20px 0;

    padding:16px 24px;

    border:none;

    border-radius:15px;

    background:linear-gradient(135deg,#FF3D3D,#D50000);

    box-shadow:0 8px 22px rgba(213,0,0,.25);

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 8px 22px rgba(229,57,53,.35);

}

#videoBtn:hover{

    transform:translateY(-3px);

    box-shadow:0 12px 28px rgba(229,57,53,.45);

    background:linear-gradient(135deg,#FF5252,#E53935);

}

#videoBtn:active{

    transform:scale(.97);

}

#videoBox{
    display:none;
    margin-top:15px;
}
.card{

    background:white;

    border-radius:18px;

    padding:24px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}

/* Mobile */
@media (max-width:768px){

    body{
        max-width:100%;
        padding:12px;
    }

    h1{
        font-size:30px;
    }

    h1 span{
        font-size:34px;
    }

    h1 small{
        font-size:18px;
    }

    .buttons{
        grid-template-columns:1fr;
        gap:10px;
    }

    .buttons button{
        min-height:52px;
        padding:12px 14px;
        font-size:15px;
        border-radius:10px;
    }

}

.lesson-title {
    grid-column: 1 / -1;

    margin-top: 12px;
    padding: 12px 16px;

    background: #E3F2FD;
    color: #1565C0;

    border-radius: 10px;

    font-size: 18px;
    font-weight: 700;
}


</style>
</head>
<body>
<h1>
<span>📘</span>
Tiếng Anh 4
<small>Global Success</small>
</h1>
<div class="top">
<button onclick="location.href='https://online.flipbuilder.com/sdtta/nhxm/'">📚 Sách học English</button>
<button onclick="location.href='English_quiz.html'">🎯 Đấu Trường English</button>
</div>
<div class="card">
<label>Chọn Unit</label>
<select id="unitSelect"></select>
<div id="lessonButtons" class="buttons"></div>
</div>
<button id="videoBtn">🎬 Xem video bài học</button>
<div id="videoBox" style="display:none;">
    <iframe id="videoFrame" allowfullscreen></iframe>
</div>

<script src="data.js"></script>

<script>
const unitSelect = document.getElementById('unitSelect');
const videoFrame = document.getElementById('videoFrame');
const videoBox = document.getElementById('videoBox');
const videoBtn = document.getElementById('videoBtn');
const lessonButtons = document.getElementById('lessonButtons');


// ===============================
// Tạo danh sách Unit
// ===============================
for (const key in data) {
    const op = document.createElement('option');

    op.value = key;
    op.textContent = data[key].title;

    unitSelect.appendChild(op);
}


// ===============================
// Khôi phục Unit đã chọn
// ===============================
const savedUnit = localStorage.getItem('unit');

if (savedUnit && data[savedUnit]) {
    unitSelect.value = savedUnit;
}


// ===============================
// Hiển thị tất cả Lesson
// ===============================
function loadLessons() {

    const unit = data[unitSelect.value];

    // Lưu Unit
    localStorage.setItem('unit', unitSelect.value);

    // Đóng video khi đổi Unit
    videoFrame.src = "";
    videoBox.style.display = "none";

    updateVideoButton();

    // Xóa danh sách cũ
    lessonButtons.innerHTML = "";

    // Duyệt tất cả Lesson
    Object.keys(unit.lessons).forEach(lessonName => {

        const lessonTitle = document.createElement('div');

        lessonTitle.className = "lesson-title";
        lessonTitle.textContent = lessonName;

        lessonButtons.appendChild(lessonTitle);


        // Các bài trong Lesson
        const list = unit.lessons[lessonName];

        list.forEach(item => {

            const button = document.createElement('button');

            button.textContent = item.title;

            button.onclick = () => {
                location.href = item.url;
            };

            lessonButtons.appendChild(button);

        });

    });
}


// ===============================
// Đổi Unit
// ===============================
unitSelect.onchange = loadLessons;


// ===============================
// Video
// ===============================
videoBtn.onclick = function () {

    if (videoBox.style.display === "none") {

        const video = data[unitSelect.value].video;

        if (!video) {
            alert("Unit này chưa có video.");
            return;
        }

        videoFrame.src = video;

        videoBox.style.display = "block";

        videoBtn.textContent =
            "❌ Đóng video " + unitSelect.value;

        setTimeout(() => {

            videoBox.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }, 200);

    } else {

        videoFrame.src = "";

        videoBox.style.display = "none";

        updateVideoButton();

    }

};


// ===============================
// Cập nhật tên nút video
// ===============================
function updateVideoButton() {

    const unitName = unitSelect.value;

    videoBtn.textContent =
        "🎬 Xem video " + unitName;
}


// ===============================
// Khởi động
// ===============================
loadLessons();

</script>

</script>
</body>
</html>
