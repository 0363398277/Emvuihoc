<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>💣 Bomber Arena - Laser Core</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
}

body{
    padding:16px;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -20%,#334b7a,#101827 45%,#020617);
}

button{font:inherit}

.app{
    width:min(1100px,100%);
    margin:auto;
}

.logo{
    text-align:center;
    font-size:clamp(38px,7vw,64px);
    font-weight:900;
    background:linear-gradient(
        90deg,
        #38bdf8,#818cf8,#e879f9,#facc15
    );
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin:5px 0 22px;
}

/* ================= MENU ================= */

.menu{
    max-width:760px;
    margin:auto;
    padding:25px;
    border-radius:24px;
    background:#0f172af0;
    border:1px solid #334155;
    box-shadow:0 30px 100px #0009;
}

.menu h2{text-align:center}

.modes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.mode{
    padding:20px;
    color:#fff;
    text-align:left;
    cursor:pointer;
    border-radius:18px;
    border:1px solid #e976ff;
    background:linear-gradient(145deg,#1e293b,#0b1220);
    transition:.18s;
}

.mode:hover{
    transform:translateY(-4px);
    border-color:#38bdf8;
    box-shadow:0 12px 30px #0ea5e933;
}

.mode-icon{font-size:34px}

.mode strong{
    display:block;
    margin-top:10px;
}

.mode span{
    display:block;
    margin-top:8px;
    color:#94a3b8;
    line-height:1.5;
}

.help{
    margin-top:20px;
    padding:16px;
    border-radius:15px;
    background:#050b15;
    border:1px solid #26354d;
    line-height:1.5;
}

.help table{
    width:100%;
    border-collapse:collapse;
}

.help td{
    padding:6px;
    border-bottom:1px solid #1e293b;
}

.help td:first-child{
    width:130px;
    color:#7dd3fc;
    font-weight:bold;
}

.sound-menu{
    display:flex;
    justify-content:center;
    margin-top:18px;
}

.sound-button{
    padding:10px 18px;
    color:white;
    cursor:pointer;
    border-radius:12px;
    border:1px solid #40506e;
    background:linear-gradient(145deg,#182238,#0b1220);
}

.sound-button:hover{
    border-color:#38bdf8;
    box-shadow:0 0 20px #0ea5e933;
}

/* ================= GAME ================= */

#game{display:none}

.hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.stats{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.stat{
    min-width:66px;
    padding:6px 9px;
    border-radius:10px;
    background:#111827ed;
    border:1px solid #334155;
}

.stat small{
    display:block;
    color:#94a3b8;
    font-size:9px;
}

.stat b{font-size:14px}

.actions{
    display:flex;
    gap:6px;
}

.ui-btn{
    padding:8px 12px;
    color:white;
    cursor:pointer;
    border-radius:10px;
    border:1px solid #40506e;
    background:#182238;
}

.ui-btn:hover{
    border-color:#38bdf8;
}

/* ================= ARENA ================= */

.board-wrap{
    width:100%;
    overflow:auto;
    padding:5px;
}

.arena{
    width:max-content;
    margin:auto;
    padding:9px;
    border-radius:20px;
    background:#030712;
    border:1px solid #40506e;
    box-shadow:0 30px 80px #0009;
}

.board{
    position:relative;
    width:630px;
    height:462px;
    overflow:hidden;
    background:#202b40;
    border-radius:7px;
}

/* ================= MAP ================= */

.tile{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:5px;
}

.floor{
    background:
        linear-gradient(
            135deg,
            #344158 25%,
            #29364d 25%,
            #29364d 50%,
            #344158 50%,
            #344158 75%,
            #29364d 75%
        );
    background-size:8px 8px;
}

.wall{
    background:linear-gradient(145deg,#5b6980,#1d2738);
    border:1px solid #65748c;
    box-shadow:inset 2px 2px #ffffff14,inset -3px -3px #0005;
}

.brick{
    background:linear-gradient(145deg,#df9754,#753c1e);
    border:1px solid #5a2c17;
    box-shadow:inset 3px 3px #ffffff18,inset -3px -3px #0006;
}

/* ================= DYNAMIC ================= */

.dynamic{
    position:absolute;
    inset:0;
    pointer-events:none;
}

/* ================= CHARACTERS ================= */

.entity{
    position:absolute;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    z-index:30;
    will-change:transform;
    pointer-events:none;
    transform-origin:center;
}

.entity.player{
    filter:
        drop-shadow(0 5px 2px #000b)
        drop-shadow(0 0 7px #60a5fa88);
}

.entity.bot{
    filter:
        drop-shadow(0 5px 2px #000b)
        drop-shadow(0 0 7px #f43f5e66);
}

/* ================= LASER SHIELD ================= */

.shield-ring{
    position:absolute;
    width:44px;
    height:44px;
    border-radius:50%;
    z-index:31;
    pointer-events:none;
    border:3px solid #00eaff;

    background:
        radial-gradient(
            circle,
            rgba(0,234,255,.05),
            rgba(0,234,255,.02) 50%,
            transparent 70%
        );

    box-shadow:
        0 0 6px #fff,
        0 0 12px #00eaff,
        0 0 25px #00eaff,
        inset 0 0 12px #00eaff;

    animation:
        shieldPulse .55s ease-in-out infinite alternate,
        shieldRotate 2s linear infinite;
}

.shield-ring::before,
.shield-ring::after{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:50%;
    border:1px solid #67e8f9;
    opacity:.65;
}

.shield-ring::after{
    inset:-12px;
    border-color:#22d3ee;
    opacity:.25;
}

@keyframes shieldPulse{
    from{transform:scale(.93)}
    to{transform:scale(1.08)}
}

@keyframes shieldRotate{
    from{filter:hue-rotate(0deg)}
    to{filter:hue-rotate(360deg)}
}

/* ================= BOMB ================= */

.bomb{
    position:absolute;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    border-radius:50%;
    z-index:20;
}

.laser-bomb{
    animation:bombPulse .45s ease-in-out infinite alternate;
}

@keyframes bombPulse{
    from{
        transform:scale(.9);
        filter:brightness(1);
    }
    to{
        transform:scale(1.1);
        filter:brightness(2);
    }
}

/* ================= NORMAL FIRE ================= */

.fire{
    position:absolute;
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    border-radius:9px;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #fff600 20%,
            #ff9d00 48%,
            #ef2c18 75%,
            transparent 100%
        );

    box-shadow:
        0 0 12px #ff9d00,
        0 0 28px #ff3b00;

    animation:firePop .35s ease-out forwards;
}

.fire::after{
    content:"🔥";
    font-size:26px;
}

@keyframes firePop{
    from{transform:scale(.65);opacity:.4}
    to{transform:scale(1);opacity:1}
}

/* ================= LASER CORE ================= */

.laser{
    position:absolute;
    z-index:58;
    pointer-events:none;
    overflow:visible;
    transform-origin:center;
    animation:laserDisappear .65s ease-out forwards;
}

.laser-glow{
    position:absolute;
    inset:0;
    border-radius:999px;
    background:var(--laser);
    filter:blur(9px);
    opacity:.85;
}

.laser-mid{
    position:absolute;
    inset:2px 0;
    border-radius:999px;
    background:
        linear-gradient(
            var(--gradient),
            transparent 0%,
            var(--light) 20%,
            var(--laser) 45%,
            #fff 50%,
            var(--laser) 55%,
            var(--light) 80%,
            transparent 100%
        );
    box-shadow:
        0 0 8px #fff,
        0 0 20px var(--laser),
        0 0 40px var(--laser);
}

.laser-core{
    position:absolute;
    left:0;
    right:0;
    top:35%;
    height:30%;
    border-radius:999px;
    background:#fff;
    box-shadow:
        0 0 4px #fff,
        0 0 12px #fff,
        0 0 25px var(--laser);
}

@keyframes laserDisappear{
    0%{
        opacity:1;
        filter:brightness(2.8);
        transform:scaleX(.85);
    }
    15%{
        transform:scaleX(1.04);
    }
    65%{
        opacity:.9;
        filter:brightness(1.8);
    }
    100%{
        opacity:0;
        transform:scaleX(1);
    }
}

/* ================= LASER CORE EXPLOSION ================= */

.laser-core-explosion{
    position:absolute;
    width:95px;
    height:95px;
    z-index:70;
    pointer-events:none;
    border-radius:50%;
    transform:translate(-26px,-26px);

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #fff 8%,
            var(--laser) 20%,
            rgba(255,255,255,.8) 30%,
            transparent 70%
        );

    box-shadow:
        0 0 12px #fff,
        0 0 30px var(--laser),
        0 0 70px var(--laser),
        0 0 110px var(--laser);

    animation:coreExplosion .65s ease-out forwards;
}

@keyframes coreExplosion{
    0%{
        opacity:1;
        transform:translate(-26px,-26px) scale(.2);
    }
    45%{
        opacity:1;
        transform:translate(-26px,-26px) scale(1.15);
    }
    100%{
        opacity:0;
        transform:translate(-26px,-26px) scale(1.8);
    }
}

/* ================= LASER PARTICLES ================= */

.laser-particle{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    z-index:72;
    pointer-events:none;
    background:#fff;
    box-shadow:
        0 0 7px #fff,
        0 0 16px var(--laser),
        0 0 28px var(--laser);

    animation:particleFly .65s ease-out forwards;
}

@keyframes particleFly{
    0%{
        opacity:1;
        transform:translate(0,0) scale(1.2);
    }
    100%{
        opacity:0;
        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.1);
    }
}

/* ================= POWER ================= */

.power{
    position:absolute;
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    z-index:12;
}

.power-bomb-item{
    border:2px solid #f97316;
    border-radius:50%;
    background:rgba(249,115,22,.25);
    box-shadow:
        0 0 12px #f97316,
        inset 0 0 6px #fdba74;
}

/* ================= MESSAGE ================= */

.message{
    min-height:31px;
    padding:8px;
    text-align:center;
    color:#cbd5e1;
    font-weight:bold;
}

/* ================= MOBILE ================= */

.mobile-controls{
    display:none;
    grid-template-columns:repeat(3,58px);
    gap:7px;
    justify-content:center;
    margin-top:7px;
}

.mobile-controls button{
    height:55px;
    color:white;
    font-size:21px;
    cursor:pointer;
    border-radius:14px;
    border:1px solid #40506e;
    background:#182238;
}

.mobile-controls .bomb-button{
    background:#7f1d1d;
    border-color:#ef4444;
}

/* ================= RESULT ================= */

.result{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:#020617dd;
    backdrop-filter:blur(8px);
}

.result.show{display:flex}

.result-card{
    width:min(430px,92%);
    padding:30px;
    text-align:center;
    border-radius:23px;
    background:#111827;
    border:1px solid #40506e;
    box-shadow:0 30px 100px #000;
}

.big-btn{
    width:100%;
    padding:13px;
    margin-top:8px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#2563eb,#7c3aed);
}

@media(max-width:700px){
    body{padding:8px}
    .modes{grid-template-columns:1fr}
    .mobile-controls{display:grid}
    .board-wrap{max-height:62vh}
}

/* ================= AI COUNT ================= */

.ai-setting{
    margin:18px 0;
    padding:16px;
    border-radius:16px;
    background:#050b15;
    border:1px solid #26354d;
    text-align:center;
}

.ai-setting label{
    display:block;
    color:#7dd3fc;
    margin-bottom:10px;
}

.ai-input-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.ai-input-row button{
    width:44px;
    height:42px;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    border-radius:10px;
    border:1px solid #40506e;
    background:#182238;
}

.ai-input-row button:hover{
    border-color:#38bdf8;
    background:#1e293b;
}

#aiCount{
    width:90px;
    height:42px;
    padding:0 10px;
    color:#fff;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    border-radius:10px;
    border:1px solid #40506e;
    outline:none;
    background:#0f172a;
}

#aiCount:focus{
    border-color:#38bdf8;
    box-shadow:0 0 15px #38bdf844;
}

.ai-setting small{
    display:block;
    margin-top:8px;
    color:#64748b;
}

</style>
</head>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

let W=25;
let H=11;
const TILE=42;

// Thêm phần lấy giá trị từ ô input người dùng vừa tạo
const mapWidthInput = document.getElementById("mapWidth");
const mapHeightInput = document.getElementById("mapHeight");

function clampMapSize(){

    let w=parseInt(
        mapWidthInput.value,
        10
    );

    let h=parseInt(
        mapHeightInput.value,
        10
    );

    if(!Number.isFinite(w)){
        w=25;
    }

    if(!Number.isFinite(h)){
        h=11;
    }

    W=Math.max(
        10,
        Math.min(40,w)
    );

    H=Math.max(
        7,
        Math.min(25,h)
    );

    mapWidthInput.value=W;
    mapHeightInput.value=H;
}


/*
 * Khi đang gõ:
 * KHÔNG tự sửa giá trị.
 *
 * Chỉ kiểm tra khi người dùng rời khỏi ô.
 */
mapWidthInput.addEventListener(
    "change",
    clampMapSize
);

mapHeightInput.addEventListener(
    "change",
    clampMapSize
);


const EMPTY=0;
const WALL=1;
const BRICK=2;

const LASER_PALETTES=[
    {
        color:"#00eaff",
        colorLight:"#ffffff"
    },
    {
        color:"#ff315c",
        colorLight:"#ff99aa"
    },
    {
        color:"#22c55e",

let audioCtx=null;
let masterGain=null;
let musicGain=null;

let soundEnabled=true;

const bombSoundTimers=new Map();


function ensureAudio(){

    if(!soundEnabled){
        return false;
    }

    try{

        if(!audioCtx){

            const AudioContextClass=
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AudioContextClass){
                return false;
            }

            audioCtx=
                new AudioContextClass();

            masterGain=
                audioCtx.createGain();

            musicGain=
                audioCtx.createGain();

            // Đặt mức âm lượng ban đầu là 25% (0.25) theo yêu cầu của bạn
            masterGain.gain.value = 0.25;
            musicGain.gain.value = 0.075;

            masterGain.connect(
                audioCtx.destination
            );

            musicGain.connect(
                audioCtx.destination
            );
            
            // Đồng bộ giá trị của thanh trượt giao diện với giá trị khởi tạo
            const slider = document.getElementById("volumeSlider");
            if(slider) slider.value = 25;
        }


        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }

        return true;

    }
    catch(err){

        console.warn(
            "Audio không khả dụng:",
            err
        );

        return false;
    }
}

/* =========================================================
   AUDIO HELPERS
========================================================= */

function tone(
    frequency,
    duration,
    options={}
){

    if(!ensureAudio()){
        return;
    }

    const {
        type="sine",
        volume=.15,
        attack=.008,
        release=.08,
        detune=0,
        when=0
    }=options;

    const start=
        audioCtx.currentTime+
        when;

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    osc.type=type;

    osc.frequency.setValueAtTime(
        frequency,
        start
    );

    osc.detune.setValueAtTime(
        detune,
        start
    );

    gain.gain.setValueAtTime(
        0,
        start
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        start+attack
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start+
        duration+
        release
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(start);

    osc.stop(
        start+
        duration+
        release+
        .02
    );
}


function noise(
    duration=.18,
    volume=.18,
    filterFreq=1600
){

    if(!ensureAudio()){
        return;
    }

    const buffer=
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data=
        buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i]=
            (Math.random()*2-1)*
            (1-i/data.length);
    }

    const source=
        audioCtx.createBufferSource();

    const filter=
        audioCtx.createBiquadFilter();

    const gain=
        audioCtx.createGain();

    filter.type="lowpass";

    filter.frequency.value=
        filterFreq;

    gain.gain.value=
        volume;

    source.buffer=buffer;

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    source.start();

    source.stop(
        audioCtx.currentTime+
        duration
    );
}

/* =========================================================
   BACKGROUND MUSIC
========================================================= */

const musicNotes=[
    130.81,
    164.81,
    196.00,
    246.94,
    196.00,
    164.81,
    146.83,
    220.00
];


function musicPulse(){

    if(
        !soundEnabled ||
        !audioCtx ||
        !musicGain
    ){
        return;
    }

    const frequency=
        musicNotes[
            musicStep%
            musicNotes.length
        ];

    const now=
        audioCtx.currentTime;

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    osc.type="triangle";

    osc.frequency.setValueAtTime(
        frequency,
        now
    );

    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        .8,
        now+.025
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now+.55
    );

    osc.connect(gain);
    gain.connect(musicGain);

    osc.start(now);

    osc.stop(now+.6);

    /*
     * Một lớp harmonic rất nhẹ.
     */
    const harmony=
        audioCtx.createOscillator();

    const harmonyGain=
        audioCtx.createGain();

    harmony.type="sine";

    harmony.frequency.setValueAtTime(
        frequency*2,
        now
    );

    harmonyGain.gain.setValueAtTime(
        0,
        now
    );

    harmonyGain.gain.linearRampToValueAtTime(
        .18,
        now+.03
    );

    harmonyGain.gain.exponentialRampToValueAtTime(
        .001,
        now+.45
    );

    harmony.connect(harmonyGain);
    harmonyGain.connect(musicGain);

    harmony.start(now);
    harmony.stop(now+.5);

    musicStep++;
}


function startMusic(){

    if(!soundEnabled){
        return;
    }

    if(!ensureAudio()){
        return;
    }

    if(musicTimer){
        return;
    }

    musicStep=0;

    musicPulse();

    musicTimer=
        setInterval(
            musicPulse,
            620
        );
}


function stopMusic(){

    if(musicTimer){

        clearInterval(
            musicTimer
        );

        musicTimer=null;
    }
}

/* =========================================================

========================================================= */

function key(x,y){

}

function inside(x,y){
    return x>=0 &&
           y>=0 &&
           x<W &&
           y<H;
}

function getBomb(x,y){
    return bombs.find(
        b=>b.x===x && b.y===y
    );
}

function randomItem(arr){
    return arr.length
        ? arr[Math.floor(Math.random()*arr.length)]
        : null;
}

function distance(a,b){
    return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
}


/* =========================================================
   MAP
========================================================= */

function createMap(){

    map=[];

    for(let y=0;y<H;y++){

        const row=[];

        for(let x=0;x<W;x++){

            if(
                x===0 ||
                y===0 ||
                x===W-1 ||
                y===H-1
            ){
                row.push(WALL);
                continue;
            }

            if(x%2===0 && y%2===0){
                row.push(WALL);
                continue;
            }

            const spawn=
                (x<=3 && y<=3) ||
                (x>=W-4 && y<=3) ||
                (x<=3 && y>=H-4) ||
                (x>=W-4 && y>=H-4);

            if(spawn){
                row.push(EMPTY);
            }
            else{
                row.push(
                    Math.random()<.46
                    ? BRICK
                    : EMPTY
                );
            }
        }

        map.push(row);
    }
}

     * hệ thống sẽ tự tìm ô trống ngẫu nhiên.

    const preferredSpawns=[

        {x:W-2,y:H-2},
        {x:5,y:1},

        {x:3,y:3},
        {x:11,y:3},
        {x:3,y:7},
        {x:11,y:7}
    ];

    const used=new Set();

    /*
     * Đánh dấu vị trí của người chơi.
     */
    for(const player of players){

        used.add(
            key(player.x,player.y)
        );
    }

    function findBotSpawn(){

        /*
         * Ưu tiên vị trí đẹp được định sẵn.
         */
        for(const pos of preferredSpawns){

            const k=key(pos.x,pos.y);

            if(
                !used.has(k) &&
                inside(pos.x,pos.y) &&
                map[pos.y][pos.x]===EMPTY
            ){

                used.add(k);

                return pos;
            }
        }

        /*
         * Nếu hết vị trí ưu tiên,
         * tìm ngẫu nhiên ô trống.
         */
        const free=[];

for(let y=1;y<H-1;y++){

    for(let x=1;x<W-1;x++){

        const k=key(x,y);

        if(
            map[y][x]!==EMPTY ||
            used.has(k)
        ){
            continue;
        }

        /*
         * Không spawn AI quá sát người chơi.
         */
        let tooClose=false;

        for(
            const player of players
        ){

            if(
                Math.abs(x-player.x)+
                Math.abs(y-player.y)
                <3
            ){

                tooClose=true;
                break;
            }
        }

        if(!tooClose){

            free.push({
                x,
                y
            });
        }
    }
}


        const pos=randomItem(free);

        if(pos){
            used.add(
                key(pos.x,pos.y)
            );
        }

        return pos;
    }

    const botEmojis=[

        "🔥"
    ];

    for(
        let i=0;
        i<aiCount;
        i++
    ){

        const spawn=findBotSpawn();

        if(!spawn){
            break;

        bots.push(

                    i%botEmojis.length

                spawn.x,

            )
        );

function updateEntityVisual(entity){

    if(!entity.el) return;

    if(!entity.alive){

        entity.el.style.display="none";

        if(entity.shieldEl){
            entity.shieldEl.style.display="none";
        }

        return;
    }

    entity.el.style.display="flex";

    entity.el.style.transform=
        `translate3d(
            ${entity.x*TILE+3}px,
            ${entity.y*TILE+3}px,
            0
        )`;

    const shieldActive=
        entity.laserShieldUntil &&
        performance.now()<
        entity.laserShieldUntil;

    if(shieldActive){

        entity.shieldEl.style.display="block";

        entity.shieldEl.style.left=
            `${entity.x*TILE-1}px`;

        entity.shieldEl.style.top=
            `${entity.y*TILE-1}px`;

        entity.shieldEl.style.transform=
            "none";

    }
    else if(entity.shield>0){

        entity.shieldEl.style.display="block";

        entity.shieldEl.style.left=
            `${entity.x*TILE-1}px`;

        entity.shieldEl.style.top=
            `${entity.y*TILE-1}px`;

        entity.shieldEl.style.transform=
            "none";

    }
    else{

        entity.shieldEl.style.display="none";
    }
}


/* =========================================================
   MOVEMENT
========================================================= */

function canStand(
    x,
    y,
    entity
){

    if(!inside(x,y)) return false;

    if(map[y][x]!==EMPTY){
        return false;
    }

    const bomb=getBomb(x,y);

    if(
        bomb &&
        (
            x!==Math.round(entity.x) ||
            y!==Math.round(entity.y)
        )
    ){
        return false;
    }

    for(
        const other of [...players,...bots]
    ){

        if(
            other!==entity &&
            other.alive &&
            Math.round(other.x)===x &&
            Math.round(other.y)===y
        ){
            return false;
        }
    }

    return true;
}


function requestMove(
    entity,
    dx,
    dy
){

    if(
        !running ||
        !entity.alive
    ){
        return false;
    }

    if(entity.moving){

        if(
            Math.hypot(
                entity.targetX-entity.x,
                entity.targetY-entity.y
            )>.15
        ){
            return false;
        }

        entity.x=entity.targetX;
        entity.y=entity.targetY;

        entity.moving=false;
    }

    const nx=
        Math.round(entity.x)+dx;

    const ny=
        Math.round(entity.y)+dy;

    if(!canStand(nx,ny,entity)){
        return false;
    }

    entity.targetX=nx;
    entity.targetY=ny;

    entity.moving=true;

    if(entity.type==="player"){
        sfxMove();
    }

    return true;
}


function updateMovement(dt){

    for(
        const entity of [...players,...bots]
    ){

        if(
            !entity.alive ||
            !entity.moving
        ){
            continue;
        }

        let speed=entity.speed;

        const now=performance.now();

        if(
            entity.dashUntil &&
            now<entity.dashUntil
        ){
            speed*=1.8;
        }

        const dx=
            entity.targetX-entity.x;

        const dy=
            entity.targetY-entity.y;

        const d=Math.hypot(dx,dy);

        const step=speed*dt;

        if(step>=d){

            entity.x=entity.targetX;
            entity.y=entity.targetY;

            entity.moving=false;

            collectPower(entity);

        }
        else{

            entity.x+=
                (dx/d)*step;

            entity.y+=
                (dy/d)*step;

            collectPower(entity);
        }
    }
}


/* =========================================================
   MAP RENDER
========================================================= */

function renderMap(){

    mapLayer.innerHTML="";

    for(let y=0;y<H;y++){

        for(let x=0;x<W;x++){

                    : "floor"
                );

            el.style.top=
                y*TILE+"px";

            mapLayer.appendChild(el);
        }

}


/* =========================================================
   POWER UPS
========================================================= */

const POWER_TYPES=[
    {
        type:"life",
        emoji:"❤️"
    },
    {
        type:"shield",
        emoji:"🛡️"
    },
    {
        type:"laser",
        emoji:"⚡"
    },
    {
        type:"range",
        emoji:"🔥"
    },
    {
        type:"bomb",
        emoji:"💣"
    },
    {
        type:"coin",
        emoji:"💰"
    }
];


function maybePowerup(
    x,
    y
){

    if(Math.random()>.75){
        return;
    }

    const power=
        randomItem(POWER_TYPES);

    const palette=
        power.type==="laser"
        ? randomItem(LASER_PALETTES)
        : {
            color:"#00eaff",
            colorLight:"#ffffff"
        };

    powerups.push({

        x,
        y,

        type:power.type,

        emoji:power.emoji,

        color:palette.color,

        colorLight:palette.colorLight
    });
}


function collectPower(entity){

    if(!entity.alive){
        return;
    }

    for(
        let i=powerups.length-1;
        i>=0;
        i--
    ){

        const power=powerups[i];

        if(
            Math.abs(entity.x-power.x)<.6 &&
            Math.abs(entity.y-power.y)<.6
        ){

            powerups.splice(i,1);

            if(
                power.type==="life" &&
                entity.type==="player"
            ){

                entity.lives++;

                sfxLife();

                setMessage(
                    `${entity.emoji} ❤️ +1 mạng!`
                );
            }

            else if(
                power.type==="shield"
            ){

                entity.shield++;

                sfxShield();

                setMessage(
                    `${entity.emoji} 🛡️ Khiên!`
                );
            }

            else if(
                power.type==="laser" &&
                entity.type==="player"
            ){

                entity.laserCharges=3;

                entity.color=
                    power.color;

                entity.colorLight=
                    power.colorLight;

                sfxLaserCharge();

                setMessage(
                    `${entity.emoji} ⚡ Đã nhận Bom Laser!`
                );
            }

            else if(
                power.type==="range"
            ){

                entity.range++;

                sfxPowerup();

                setMessage(
                    `${entity.emoji} 🔥 Tầm nổ +1!`
                );
            }

            else if(
                power.type==="bomb"
            ){

                entity.maxBombs++;

                sfxPowerup();

                setMessage(
                    `${entity.emoji} 💣 Thêm bom!`
                );
            }

            else if(
                power.type==="coin"
            ){

                score+=250;

                sfxCoin();

                setMessage(
                    `${entity.emoji} 💰 +250 điểm!`
                );
            }

            renderDynamic();

            break;
        }
    }
}


/* =========================================================
   BOMB PLACEMENT
========================================================= */

function placeBomb(entity){

    if(
        !running ||
        !entity.alive ||
        entity.activeBombs>=entity.maxBombs
    ){
        return;
    }

    const x=Math.round(entity.x);
    const y=Math.round(entity.y);

    if(getBomb(x,y)){
        return;
    }

    let isLaserBomb=false;

    let color="#00eaff";
    let colorLight="#ffffff";

    if(
        entity.type==="player" &&
        entity.laserCharges>0
    ){

        isLaserBomb=true;

        color=entity.color;
        colorLight=entity.colorLight;

        entity.laserCharges--;

        sfxLaserCharge();

    }
    else{

        sfxBombPlace();
    }

    if(isLaserBomb){

        entity.laserShieldUntil=
            Infinity;
    }

    const bomb={

        x,
        y,

        owner:entity,

        range:
            isLaserBomb
            ? entity.range+3
            : entity.range,

        isLaserBomb,

        color,
        colorLight,

        exploded:false,

        timer:null
    };

    bomb.timer=setTimeout(
        ()=>explodeBomb(bomb),
        1500
    );

    bombs.push(bomb);

    entity.activeBombs++;

    startBombTick(bomb);

    if(entity.type==="bot"){

        entity.escapeUntil=
            performance.now()+1500;
    }

    renderDynamic();
}


/* =========================================================
   BOMB EXPLOSION
========================================================= */

function explodeBomb(bomb){

    if(
        !running ||
        bomb.exploded
    ){
        return;
    }

    bomb.exploded=true;

    stopBombTick(bomb);

    const idx=bombs.indexOf(bomb);

    if(idx!==-1){
        bombs.splice(idx,1);
    }

    bomb.owner.activeBombs=
        Math.max(
            0,
            bomb.owner.activeBombs-1
        );

    

    if(bomb.isLaserBomb){

        triggerLaserExplosion(bomb);

    }
    else{

        triggerNormalExplosion(bomb);
    }
}


/* =========================================================
   NORMAL EXPLOSION
========================================================= */

function getExplosionCells(
    bomb
){

    const cells=[
        {
            x:bomb.x,
            y:bomb.y
        }
    ];

    const dirs=[
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    for(
        const dir of dirs
    ){

        for(
            let i=1;
            i<=bomb.range;
            i++
        ){

            const x=
                bomb.x+
                dir.x*i;

            const y=
                bomb.y+
                dir.y*i;

            if(
                !inside(x,y) ||
                map[y][x]===WALL
            ){
                break;
            }

            cells.push({
                x,
                y
            });

            if(
                map[y][x]===BRICK
            ){

                map[y][x]=EMPTY;

                score+=25;

                maybePowerup(x,y);

                break;
            }
        }
    }

    return cells;
}


function triggerNormalExplosion(
    bomb
){

    sfxNormalExplosion();

    const cells=
        getExplosionCells(bomb);

    explosions.push({

        cells,

        expires:
            performance.now()+430
    });

    checkDamageAndChain(
        cells,
        bomb.owner,
        false
    );
}

/* =========================================================
   DAMAGE / CHAIN
========================================================= */

function checkDamageAndChain(
    cells,
    bombOwner,
    laser
){

    for(
        const entity of [...players,...bots]
    ){

        if(!entity.alive){
            continue;
        }

        /*
         * BOM LASER:
         * Chủ bom được miễn nhiễm với chính Laser của mình.
         */
        if(
            laser &&
            entity===bombOwner
        ){
            continue;
        }

        const hit=
            cells.some(
                c=>
                    c.x===Math.round(entity.x) &&
                    c.y===Math.round(entity.y)
            );

        if(hit){

            damage(
                entity,
                laser
            );
        }
    }

    const chain=
        bombs.filter(
            other=>
                cells.some(
                    c=>
                        c.x===other.x &&
                        c.y===other.y
                )
        );

    for(
        const other of chain
    ){

        clearTimeout(
            other.timer
        );

        setTimeout(
            ()=>explodeBomb(other),
            0
        );
    }

    renderMap();
    renderDynamic();
}


/* =========================================================
   DAMAGE
========================================================= */

function damage(
    entity,
    laser=false
){

    if(
        laser &&
        entity.laserShieldUntil &&
        performance.now()<
        entity.laserShieldUntil
    ){

        return;
    }

    if(entity.shield>0){

        entity.shield--;

        sfxShield();

        setMessage(
            `${entity.emoji} 🛡️ Chặn sát thương!`
        );

        return;
    }

    sfxDamage();

    if(entity.type==="bot"){

        entity.alive=false;

        score+=250;

        sfxBotDeath();

        setMessage(
            `💥 ${entity.emoji} bị hạ!`
        );

        if(
            bots.every(
                b=>!b.alive
            )
        ){

            endGame(true);
        }

        return;
    }

    entity.lives--;

    if(entity.lives<=0){

        entity.alive=false;

        setMessage(
            `${entity.emoji} ☠️ Thua cuộc!`
        );

        if(
            players.every(
                p=>!p.alive
            )
        ){

            endGame(false);
        }

        return;
    }

    entity.x=entity.spawnX;
    entity.y=entity.spawnY;

    entity.targetX=entity.spawnX;
    entity.targetY=entity.spawnY;

    entity.moving=false;
}


/* =========================================================
   AI - DANGER MAP
========================================================= */

function getBombDangerCells(
    bomb
){

    const danger=new Set();

    danger.add(
        key(bomb.x,bomb.y)
    );

    const dirs=[
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    const range=
        bomb.isLaserBomb
        ? bomb.range
        : bomb.range;

    for(
        const dir of dirs
    ){

        for(
            let i=1;
            i<=range;
            i++
        ){

            const x=
                bomb.x+
                dir.x*i;

            const y=
                bomb.y+
                dir.y*i;

            if(
                !inside(x,y) ||
                map[y][x]===WALL
            ){
                break;
            }

            danger.add(
                key(x,y)
            );

            if(
                map[y][x]===BRICK
            ){
                break;
            }
        }
    }

    return danger;
}


function getAllDanger(){

    const danger=new Set();

    for(
        const bomb of bombs
    ){

        for(
            const cell of getBombDangerCells(bomb)
        ){

            danger.add(cell);
        }
    }

    return danger;
}


function isDangerous(
    x,
    y
){

    const danger=
        getAllDanger();

    return danger.has(
        key(x,y)
    );
}


function findSafeMove(bot){

    const startX=
        Math.round(bot.x);

    const startY=
        Math.round(bot.y);

    const danger=
        getAllDanger();

    if(
        !danger.has(
            key(startX,startY)
        )
    ){
        return null;
    }

    const queue=[
        {
            x:startX,
            y:startY,
            path:[]
        }
    ];

    const visited=
        new Set([
            key(startX,startY)
        ]);

    const dirs=[
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    while(queue.length){

        const current=
            queue.shift();

        for(
            const dir of dirs
        ){

            const nx=
                current.x+
                dir.x;

            const ny=
                current.y+
                dir.y;

            const k=key(nx,ny);

            if(visited.has(k)){
                continue;
            }

            if(
                !canStand(
                    nx,
                    ny,
                    bot
                )
            ){
                continue;
            }

            visited.add(k);

            const newPath=[
                ...current.path,
                {
                    x:dir.x,
                    y:dir.y
                }
            ];

            if(
                !danger.has(k)
            ){

                return newPath[0];
            }

            queue.push({
                x:nx,
                y:ny,
                path:newPath
            });
        }
    }

    return null;
}


function botEscape(bot){

    const move=
        findSafeMove(bot);

    if(move){

        requestMove(
            bot,
            move.x,
            move.y
        );

        return true;
    }

    return false;
}


function canBotSafelyBomb(bot){

    const x=
        Math.round(bot.x);

    const y=
        Math.round(bot.y);

    const fakeBomb={
        x,
        y,
        range:bot.range,
        isLaserBomb:false
    };

    const danger=
        getBombDangerCells(
            fakeBomb
        );

    const queue=[
        {
            x,
            y,
            depth:0
        }
    ];

    const visited=
        new Set([
            key(x,y)
        ]);

    const dirs=[
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    while(queue.length){

        const cur=
            queue.shift();

        if(
            cur.depth>0 &&
            !danger.has(
                key(cur.x,cur.y)
            )
        ){

            return true;
        }

        if(cur.depth>=8){
            continue;
        }

        for(
            const dir of dirs
        ){

            const nx=
                cur.x+
                dir.x;

            const ny=
                cur.y+
                dir.y;

            const k=key(nx,ny);

            if(visited.has(k)){
                continue;
            }

            if(
                !inside(nx,ny) ||
                map[ny][nx]!==EMPTY
            ){
                continue;
            }

            let occupied=false;

            for(
                const other of [...bots,...players]
            ){

                if(
                    other!==bot &&
                    other.alive &&
                    Math.round(other.x)===nx &&
                    Math.round(other.y)===ny
                ){

                    occupied=true;
                    break;
                }
            }

            if(occupied){
                continue;
            }

            visited.add(k);

            queue.push({
                x:nx,
                y:ny,
                depth:cur.depth+1
            });
        }
    }

    return false;
}


/* =========================================================
   AI BRAIN
========================================================= */

function updateAI(){

    if(!running){
        return;
    }

    for(
        const bot of bots
    ){

        if(!bot.alive){
            continue;
        }

        if(
            bot.escapeUntil &&
            performance.now()<
            bot.escapeUntil
        ){

            if(
                botEscape(bot)
            ){
                continue;
            }
        }

        const bx=
            Math.round(bot.x);

        const by=
            Math.round(bot.y);

        if(
            isDangerous(bx,by)
        ){

            if(
                botEscape(bot)
            ){
                continue;
            }
        }

        const now=
            performance.now();

        if(
            now-bot.lastBombTime<
            2300
        ){
            continue;
        }

        const alivePlayers=
            players.filter(
                p=>p.alive
            );

        let target=
            randomItem(
                alivePlayers
            );

        if(alivePlayers.length){

            target=
                alivePlayers
                .slice()
                .sort(
                    (a,b)=>
                        distance(bot,a)-
                        distance(bot,b)
                )[0];
        }

        const dist=
            target
            ? distance(bot,target)
            : 99;

        if(
            dist<=5 &&
            bot.activeBombs<bot.maxBombs &&
            canBotSafelyBomb(bot) &&
            Math.random()<.72
        ){

            placeBomb(bot);

            bot.lastBombTime=now;

            continue;
        }

        const options=[
            {x:1,y:0},
            {x:-1,y:0},
            {x:0,y:1},
            {x:0,y:-1}
        ]
        .map(
            d=>({
                x:bx+d.x,
                y:by+d.y,
                dx:d.x,
                dy:d.y
            })
        )
        .filter(
            p=>
                canStand(
                    p.x,
                    p.y,
                    bot
                )
        );

        if(!options.length){
            continue;
        }

        const safeOptions=
            options.filter(
                p=>
                    !isDangerous(
                        p.x,
                        p.y
                    )
            );

        const usable=
            safeOptions.length
            ? safeOptions
            : options;

        if(target){

            usable.sort(
                (a,b)=>{

                    const da=
                        Math.abs(
                            a.x-
                            Math.round(target.x)
                        )+
                        Math.abs(
                            a.y-
                            Math.round(target.y)
                        );

                    const db=
                        Math.abs(
                            b.x-
                            Math.round(target.x)
                        )+
                        Math.abs(
                            b.y-
                            Math.round(target.y)
                        );

                    return da-db;
                }
            );
        }

        const chosen=
            Math.random()<.75
            ? usable[0]
            : randomItem(usable);

        requestMove(
            bot,
            chosen.dx,
            chosen.dy
        );
    }
}


/* =========================================================
   LASER / EFFECT RENDER
========================================================= */

function createLaserRay(
    laser
){

    const el=
        document.createElement("div");

    el.className="laser";

    el.style.setProperty(
        "--laser",
        laser.color
    );

    el.style.setProperty(
        "--light",
        laser.colorLight
    );

    el.style.setProperty(
        "--gradient",
        laser.horizontal
        ? "90deg"
        : "180deg"
    );

    el.style.left=
        laser.left+"px";

    el.style.top=
        laser.top+"px";

    if(laser.horizontal){

        el.style.width=
            laser.width+"px";

        el.style.height=
            "22px";

        el.style.marginTop=
            "10px";

    }
    else{

        el.style.width=
            "22px";

        el.style.height=
            laser.width+"px";

        el.style.marginLeft=
            "10px";
    }

    const glow=
        document.createElement("div");

    glow.className="laser-glow";

    const mid=
        document.createElement("div");

    mid.className="laser-mid";

    const core=
        document.createElement("div");

    core.className="laser-core";

    el.appendChild(glow);
    el.appendChild(mid);
    el.appendChild(core);

    dynamicLayer.appendChild(el);
}


function createLaserCore(
    laser
){

    const el=
        document.createElement("div");

    el.className=
        "laser-core-explosion";

    el.style.left=
        (
            laser.x*TILE+
            TILE/2
        )+"px";

    el.style.top=
        (
            laser.y*TILE+
            TILE/2
        )+"px";

    el.style.setProperty(
        "--laser",
        laser.color
    );

    dynamicLayer.appendChild(el);
}


function renderDynamic(){

    dynamicLayer
        .querySelectorAll(
            ".bomb,.fire,.power,.laser,.laser-core-explosion"
        )
        .forEach(
            el=>el.remove()
        );

    for(
        const power of powerups
    ){

        const el=
            document.createElement("div");

        el.className=
            "power"+
            (
                power.type==="bomb"
                ? " power-bomb-item"
                : ""
            );

        el.textContent=
            power.emoji;

        el.style.left=
            power.x*TILE+"px";

        el.style.top=
            power.y*TILE+"px";

        dynamicLayer.appendChild(el);
    }

    for(
        const bomb of bombs
    ){

        const el=
            document.createElement("div");

        el.className=
            "bomb"+
            (
                bomb.isLaserBomb
                ? " laser-bomb"
                : ""
            );

        el.textContent=
            bomb.isLaserBomb
            ? "⚡"
            : "💣";

        if(bomb.isLaserBomb){

            el.style.border=
                `3px solid ${bomb.color}`;

            el.style.boxShadow=
                `
                0 0 10px ${bomb.color},
                0 0 25px ${bomb.color},
                inset 0 0 10px ${bomb.color}
                `;
        }

        el.style.left=
            bomb.x*TILE+"px";

        el.style.top=
            bomb.y*TILE+"px";

        dynamicLayer.appendChild(el);
    }

    const now=
        performance.now();

    explosions=
        explosions.filter(
            e=>e.expires>now
        );

    for(
        const explosion of explosions
    ){

        for(
            const c of explosion.cells
        ){

            const el=
                document.createElement("div");

            el.className="fire";

            el.style.left=
                c.x*TILE+"px";

            el.style.top=
                c.y*TILE+"px";

            dynamicLayer.appendChild(el);
        }
    }

    lasers=
        lasers.filter(
            l=>l.expires>now
        );

    for(
        const laser of lasers
    ){

        if(laser.type==="ray"){

            createLaserRay(
                laser
            );
        }

        else if(
            laser.type==="core"
        ){

            createLaserCore(
                laser
            );
        }

        else if(
            laser.type==="spark"
        ){

            const el=
                document.createElement("div");

            el.className="laser";

            el.style.setProperty(
                "--laser",
                laser.color
            );

            el.style.setProperty(
                "--light",
                laser.colorLight
            );

            el.style.setProperty(
                "--gradient",
                laser.horizontal
                ? "90deg"
                : "180deg"
            );

            el.style.left=
                laser.x+"px";

            el.style.top=
                laser.y+"px";

            el.style.width=
                laser.horizontal
                ? laser.length*TILE
                : "8px";

            el.style.height=
                laser.horizontal
                ? "8px"
                : laser.length*TILE;

            const glow=
                document.createElement("div");

            glow.className="laser-glow";

            const core=
                document.createElement("div");

            core.className="laser-core";

            el.appendChild(glow);
            el.appendChild(core);

            dynamicLayer.appendChild(el);
        }
    }

    for(
        const entity of [...players,...bots]
    ){

        updateEntityVisual(entity);
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    scoreEl.textContent=score;

    const p1=players[0];

    if(p1){

        p1LivesEl.textContent=
            p1.alive
            ? "❤️".repeat(p1.lives)
            : "☠️";

        p1LaserStateEl.textContent=

            : "KHÔNG";

        p1LaserStateEl.style.color=
            p1.color;

            `${p1.activeBombs}/${p1.maxBombs}`;

    }

        mode===2 &&
        players[1]
    ){
        p2StatContainer.style.display="flex";

        const p2=players[1];

        p2LivesEl.textContent=
            p2.alive
            ? "❤️".repeat(p2.lives)
            : "☠️";

        p2LaserStateEl.textContent=
            p2.laserCharges>0
            ? `⚡ CÒN ${p2.laserCharges}`
            : "KHÔNG";

        p2LaserStateEl.style.color=
            p2.color;

            `${p2.activeBombs}/${p2.maxBombs}`;

        p2RangeEl.textContent=
            p2.range;
    } else {
        p2StatContainer.style.display="none";
    }
}


/* =========================================================
   MESSAGE
========================================================= */

function setMessage(text){

    messageEl.textContent=text;

    if(messageTimer){
        clearTimeout(messageTimer);
    }

    messageTimer=
        setTimeout(
            ()=>{
                if(running){
                    messageEl.textContent=
                        "💣 Tiếp tục chiến đấu!";
                }
            },
            1600
        );
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

    if(!running){
        return;
    }

    let dt=
        (time-lastTime)/1000;

    /*
     * Giới hạn dt để tránh game bị nhảy
     * nếu tab trình duyệt bị treo một lúc.
     */
    dt=Math.min(dt,.05);

    lastTime=time;

    if(mode===1){

        if(keys["ArrowUp"]){
            requestMove(
                players[0],
                0,
                -1
            );
        }
        else if(keys["ArrowDown"]){
            requestMove(
                players[0],
                0,
                1
            );
        }
        else if(keys["ArrowLeft"]){
            requestMove(
                players[0],
                -1,
                0
            );
        }
        else if(keys["ArrowRight"]){
            requestMove(
                players[0],
                1,
                0
            );
        }
    }
    else{

        if(keys["KeyW"]){
            requestMove(
                players[0],
                0,
                -1
            );
        }
        else if(keys["KeyS"]){
            requestMove(
                players[0],
                0,
                1
            );
        }
        else if(keys["KeyA"]){
            requestMove(
                players[0],
                -1,
                0
            );
        }
        else if(keys["KeyD"]){
            requestMove(
                players[0],
                1,
                0
            );
        }

        if(players[1]){

            if(keys["ArrowUp"]){
                requestMove(
                    players[1],
                    0,
                    -1
                );
            }
            else if(keys["ArrowDown"]){
                requestMove(
                    players[1],
                    0,
                    1
                );
            }
            else if(keys["ArrowLeft"]){
                requestMove(
                    players[1],
                    -1,
                    0
                );
            }
            else if(keys["ArrowRight"]){
                requestMove(
                    players[1],
                    1,
                    0
                );
            }
        }
    }

    updateMovement(dt);

    renderDynamic();

    updateHUD();

    animationId=
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   GAME END
========================================================= */

function endGame(win){

    if(!running){
        return;
    }

    running=false;

    clearInterval(aiInterval);

    stopMusic();

    bombSoundTimers.forEach(
        timer=>{
            clearInterval(timer);
        }
    );

    bombSoundTimers.clear();

    if(win){
        sfxVictory();
    }
    else{
        sfxDefeat();
    }

    resultTitle.textContent=
        win
        ? "🏆 CHIẾN THẮNG!"
        : "💥 GAME OVER";

    resultText.innerHTML=
        `Điểm đạt được: <b>${score}</b>`;

    result.classList.add("show");
}


/* =========================================================
   START GAME
========================================================= */

function startGame(
    selectedMode
){

    /*
     * Chốt kích thước bản đồ trước khi tạo map.
     */
    clampMapSize();

    mode=selectedMode;

    document.getElementById("board").style.width =
        (W*TILE)+"px";

    document.getElementById("board").style.height =
        (H*TILE)+"px";


    score=0;

    bombs=[];
    powerups=[];
    explosions=[];
    lasers=[];
    laserParticles=[];

    bombSoundTimers.forEach(
        timer=>{
            clearInterval(timer);
        }
    );

    bombSoundTimers.clear();

    createMap();

    createCharacters();

    running=true;

    menu.style.display="none";

    game.style.display="block";

    result.classList.remove("show");

    p2StatContainer.style.display=
    mode===2
    ? "flex"
    : "none";

    /*
     * Đây là thao tác click của người dùng,
     * nên trình duyệt cho phép Web Audio chạy.
     */
    ensureAudio();
    startMusic();

    renderMap();

    createCharacterElements();

    renderDynamic();

    setMessage(
        "⚡ Sẵn sàng săn mồi bằng Laser Core!"
    );

    lastTime=
        performance.now();

    cancelAnimationFrame(
        animationId
    );

    animationId=
        requestAnimationFrame(
            gameLoop
        );

    clearInterval(
        aiInterval
    );

    aiInterval=
        setInterval(
            updateAI,
            320
        );
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        const allowed=[
            "Space",
            "Enter",
            "KeyW",
            "KeyS",
            "KeyA",
            "KeyD",
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight"
        ];

        if(
            allowed.includes(e.code)
        ){
            e.preventDefault();
        }

        keys[e.code]=true;

        if(
            e.code==="Space" &&
            players[0]
        ){

            placeBomb(
                players[0]
            );
        }

        if(
    (
        e.code==="Enter" ||
        e.code==="NumpadEnter"
    ) &&
    mode===2 &&
    players[1]
){


            placeBomb(
                players[1]
            );
        }
    }
);


document.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);

/* =========================================================
   AI COUNT CONTROL
========================================================= */

function clampAI(value){

    value=parseInt(value,10);

    if(!Number.isFinite(value)){
        value=3;
    }

    return Math.max(
        1,
        Math.min(
            20,
            value
        )
    );
}


function updateAIInput(){

    aiCount=
        clampAI(
            aiCountInput.value
        );

    aiCountInput.value=
        aiCount;
}


aiMinus.addEventListener(
    "click",
    ()=>{

        aiCount=
            clampAI(aiCount-1);

        aiCountInput.value=
            aiCount;
    }
);


aiPlus.addEventListener(
    "click",
    ()=>{

        aiCount=
            clampAI(aiCount+1);

        aiCountInput.value=
            aiCount;
    }
);


aiCountInput.addEventListener(
    "input",
    ()=>{
        updateAIInput();
    }
);


aiCountInput.addEventListener(
    "change",
    ()=>{
        updateAIInput();
    }
);


/* =========================================================
   MOBILE CONTROL
========================================================= */

document
.querySelectorAll("[data-dir]")
.forEach(
    btn=>{

        btn.addEventListener(
            "click",
            ()=>{

                if(!players[0]){
                    return;
                }

                const d=
                    btn.dataset.dir;

                const dx=
                    d==="left"
                    ? -1
                    : d==="right"
                    ? 1
                    : 0;

                const dy=
                    d==="up"
                    ? -1
                    : d==="down"
                    ? 1
                    : 0;

                requestMove(
                    players[0],
                    dx,
                    dy
                );
            }
        );
    }
);
