<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đập Chuột VIP PRO 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background:
              radial-gradient(circle at 50% -10%, rgba(255,235,59,.16), transparent 34%),
              radial-gradient(circle at 10% 90%, rgba(0,229,255,.10), transparent 28%),
              radial-gradient(circle at 90% 80%, rgba(255,64,129,.10), transparent 28%),
              linear-gradient(135deg,#071b13 0%,#0b3b27 48%,#062219 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body::before {
            content: "";
            position: fixed; inset: 0; pointer-events: none; z-index: -1;
            background-image:
              linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
              linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);
        }

        body.playing {
            cursor: none;
        }

        h1 {
            color: #fff;
            margin: 0 0 10px 0;
            position: relative;
            font-size: clamp(1.65rem, 4vw, 2.55rem);
            letter-spacing: 3px;
            text-shadow: 0 3px 0 #6d4c00, 0 0 18px rgba(255,235,59,.65), 0 8px 28px #000;
            text-transform: uppercase;
        }

        h1::after {
            content: "3D EDITION";
            display: block;
            font-size: .48em; letter-spacing: 7px; color: #b9f6ca;
            text-shadow: 0 0 12px rgba(105,240,174,.7);
            margin-top: 2px;
            text-align: center;
        }

        /* DASHBOARD GLASSMORPHISM */
        .dashboard {
            background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(0,0,0,.22));
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,.24);
            box-shadow: 0 18px 55px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.25);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            z-index: 10;
        }

        .dashboard div span {
            color: #ffeb3b;
            font-size: 1.3rem;
            text-shadow: 0 0 8px rgba(255, 235, 59, 0.6);
        }

        .control-group, .tool-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        select, button {
            cursor: pointer;
            outline: none;
        }

        select {
            padding: 6px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.65);
            background: linear-gradient(#fff, #e8f5e9);
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-start {
            padding: 8px 22px;
            font-size: 1rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff5722, #ff9800);
            color: white;
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
            transition: all 0.2s ease;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 87, 34, 0.6);
        }

        .btn-audio {
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 18px;
            backdrop-filter: blur(5px);
        }

        .time-frenzy {
            color: #ff1744 !important;
            font-size: 1.5rem !important;
            animation: pulse 0.4s infinite alternate;
            text-shadow: 0 0 12px #ff1744 !important;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.3); }
        }

        /* LƯỚI BẢNG CHƠI */
        .grid {
            position: relative;
            display: grid;
            gap: 12px;
            background: linear-gradient(145deg,#795548,#3b201a 55%,#25120e);
            padding: 16px;
            border-radius: 24px;
            border: 6px solid #a98270;
            box-shadow: 0 28px 70px rgba(0,0,0,.72), inset 0 0 25px rgba(0,0,0,.7), 0 0 0 1px rgba(255,213,79,.18);
            max-width: 98vw;
            max-height: 70vh;
            justify-content: center;
            align-items: center;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .grid::before {
            content: "";
            position: absolute; inset: 7px; border-radius: 18px;
            pointer-events: none;
            box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -5px 12px rgba(0,0,0,.35);
        }

        .hole {
            background: radial-gradient(ellipse at 50% 35%,#030201 0 46%,#160b08 48%,#5d3427 70%,#2a1711 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 3px solid #69463a;
            box-shadow: inset 0 14px 22px rgba(0,0,0,.95), inset 0 -4px 5px rgba(255,255,255,.08), 0 5px 8px rgba(0,0,0,.4);
            width: var(--cell-size, 80px);
            height: var(--cell-size, 80px);
            min-width: 0;
            min-height: 0;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hole::after {
            content: "";
            position: absolute; inset: 4px; border-radius: 50%;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,.07);
        }

        .target {
            width: 85%; height: 90%; position: absolute; left: 7.5%; bottom: -100%;
            transition: bottom .15s cubic-bezier(.175,.885,.32,1.275), transform .1s ease;
            transform-origin: bottom center;
            filter: drop-shadow(0 7px 3px rgba(0,0,0,.55));
        }

        .hole.up .target {
            bottom: 2%;
            animation: target3d .22s cubic-bezier(.17,.84,.34,1.2);
        }

        .target.hit {
            animation: targetSmash .22s ease-out forwards !important;
        }

        @keyframes target3d {
            0% { transform: translateY(20px) scale(.72) rotate(-3deg); }
            70% { transform: translateY(-2px) scale(1.04) rotate(1deg); }
            100% { transform: translateY(0) scale(1) rotate(0); }
        }

        @keyframes targetSmash {
            0% { transform: scaleY(1) scaleX(1); }
            35% { transform: scaleY(.28) scaleX(1.32) rotate(4deg); }
            100% { transform: scaleY(.22) scaleX(1.38) rotate(0); }
        }

        /* CÔNG CỤ ĐẬP 3D */
        #custom-tool {
            position: fixed; width: 116px; height: 116px; pointer-events: none; z-index: 9999;
            transform-origin: 26px 88px;
            transform: translate(-28px,-78px) rotate(-24deg);
            transition: transform .045s ease;
            display: none;
            filter: drop-shadow(7px 12px 7px rgba(0,0,0,.55));
        }

        #custom-tool.smash {
            transform: translate(-28px,-78px) rotate(-78deg);
        }

        .tool-glow {
            animation: toolGlow 1.3s ease-in-out infinite alternate;
        }

        @keyframes toolGlow {
            to { filter: drop-shadow(0 0 9px rgba(255,213,79,.65)); }
        }

        .combo {
            min-width: 100px; text-align: center; color: #fff;
            font-weight: 900; letter-spacing: .5px;
        }
        .combo b { color: #ffd54f; font-size: 1.2rem; }

        .score-pop {
            position: fixed; pointer-events: none; z-index: 10000;
            font-weight: 1000; font-size: 24px; color: #fff176;
            text-shadow: 0 3px 0 #5d4037, 0 0 12px #ff9800;
            animation: scorePop .65s ease-out forwards;
        }

        @keyframes scorePop {
            from { opacity: 1; transform: translate(-50%,-10px) scale(.7); }
            to { opacity: 0; transform: translate(-50%,-70px) scale(1.25); }
        }

        .spark {
            position: fixed; pointer-events: none; width: 8px; height: 8px;
            border-radius: 50%; background: #ffeb3b;
            box-shadow: 0 0 12px #ff9800, 0 0 4px #fff; z-index: 9998;
            animation: explode 0.4s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        .hint {
            margin-top: 12px; color: #e0e0e0; font-size: 0.95rem;
            background: rgba(0,0,0,0.3); padding: 6px 18px; border-radius: 20px;
            backdrop-filter: blur(4px); box-shadow: 0 6px 18px rgba(0,0,0,.25);
        }

        @media (max-width: 900px) {
            .dashboard { max-width: 96vw; }
            .grid { max-width: 96vw; max-height: 58vh; gap: 8px; padding: 10px; border-width: 5px; }
            .hole { border-width: 2px; }
            .hint { max-width: 94vw; text-align: center; font-size: .82rem; }
        }
        @media (max-width: 650px) {
            body { justify-content: flex-start; padding: 10px 0 14px; }
            h1 { font-size: clamp(1.25rem, 7vw, 1.8rem); letter-spacing: 1.5px; margin-bottom: 8px; }
            .dashboard { gap: 7px; padding: 9px 8px; margin-bottom: 9px; border-radius: 18px; font-size: .82rem; }
            .control-group, .tool-picker { gap: 4px; }
            select { padding: 5px 6px; font-size: .78rem; max-width: 42vw; }
            .btn-start, .btn-audio { padding: 7px 10px; font-size: .8rem; }
            .combo { min-width: 70px; }
            #custom-tool { width: 82px; height: 82px; }
            .hint { margin-top: 8px; padding: 5px 10px; }
        }
    </style>
</head>
<body>

    <h1>🔨 MOLE SMASHER VIP 🔨</h1>

    <div class="dashboard">
        <div class="control-group">
            <label for="hole-count">🕳️ Lỗ:</label>
            <select id="hole-count" onchange="renderGrid()">
                <option value="6">6 (3×2)</option>
                <option value="9" selected>9 (3×3)</option>
                <option value="12">12 (4×3)</option>
                <option value="15">15 (5×3)</option>
                <option value="18">18 (6×3)</option>
                <option value="21">21 (7×3)</option>
                <option value="24">24 (8×3)</option>
                <option value="27">27 (9×3)</option>
                <option value="30">30 (10×3)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="difficulty">⚡ Cấp:</label>
            <select id="difficulty">
                <option value="easy">Dễ</option>
                <option value="medium" selected>Vừa</option>
                <option value="hard">Khó</option>
            </select>
        </div>

        <div class="tool-picker">
            <label for="target-select">🎯 Mục tiêu:</label>
            <select id="target-select" onchange="changeTarget()">
                <option value="mole">🐭 Chuột</option>
                <option value="hedgehog">🦔 Nhím</option>
                <option value="frog">🐸 Ếch cốm</option>
                <option value="robot">🤖 Robot</option>
                <option value="alien">👽 Người ngoài hành tinh</option>
                <option value="carrot">🥕 Cà rốt</option>
                <option value="radish">🌱 Củ cải</option>
                <option value="cat">🐱 Con mèo</option>
                <option value="pumpkin">🎃 Bí ngô</option>
                <option value="tomato">🍅 Cà chua</option>
            </select>
        </div>

        <div class="tool-picker">
            <label for="tool-select">🔨 Công cụ:</label>
            <select id="tool-select" onchange="changeTool()">
                <option value="hammer">🔨 Búa 1</option>
                <option value="mallet">🔨 Búa 2</option>
                <option value="gavel">🔨 Búa 3</option>
                <option value="toy">🔨 Búa 4</option>
                <option value="lightsaber">🗡️ Kiếm sáng</option>
                <option value="broom">🧹 Chổi rơm</option>
                <option value="lightning">⚡ Sét Thor</option>
                <option value="axe">🪓 Rìu chiến</option>
            </select>
        </div>

        <div>🏆 Điểm: <span id="score">0</span></div>
        <div class="combo">🔥 Combo: <b id="combo">0</b></div>
        <div>⏱️ <span id="time-left">30</span>s</div>

        <button class="btn-start" id="start-btn" onclick="startGame()">BẮT ĐẦU</button>
        <button class="btn-audio" id="audio-btn" onclick="toggleMute()">🔊 Âm thanh: BẬT</button>
    </div>

    <!-- Khung ma trận lỗ -->
    <div class="grid" id="game-grid"></div>

    <!-- Công cụ 3D -->
    <div id="custom-tool" class="tool-glow">
        <svg id="tool-svg" width="100%" height="100%" viewBox="0 0 120 120">
            <defs>
                <linearGradient id="wood3d" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#3e2723"/><stop offset=".4" stop-color="#8d6e63"/><stop offset="1" stop-color="#271510"/>
                </linearGradient>
                <linearGradient id="steel3d" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#cfd8dc"/><stop offset=".7" stop-color="#607d8b"/><stop offset="1" stop-color="#263238"/>
                </linearGradient>
                <linearGradient id="gold3d" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#fffde7"/><stop offset=".4" stop-color="#ffd54f"/><stop offset=".8" stop-color="#ff8f00"/><stop offset="1" stop-color="#6d4c00"/>
                </linearGradient>
                <linearGradient id="pan3d" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#546e7a"/><stop offset=".5" stop-color="#263238"/><stop offset="1" stop-color="#0f171b"/>
                </linearGradient>
                <linearGradient id="saber3d" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#00e5ff"/><stop offset="1" stop-color="#00838f"/>
                </linearGradient>
            </defs>
            <g id="tool-art"></g>
        </svg>
    </div>

    <div class="hint">⚡ <b>Chạm màn hình</b>, <b>click chuột trái</b> hoặc <b>phím Space</b> để đập • Chọn công cụ + mục tiêu ở bảng điều khiển</div>

    <script>
        const gameGrid = document.getElementById('game-grid');
        const holeCountSelect = document.getElementById('hole-count');
        const difficultySelect = document.getElementById('difficulty');
        const toolSelect = document.getElementById('tool-select');
        const targetSelect = document.getElementById('target-select');
        const scoreDisplay = document.getElementById('score');
        const comboDisplay = document.getElementById('combo');
        const timeLeftDisplay = document.getElementById('time-left');
        const startBtn = document.getElementById('start-btn');
        const audioBtn = document.getElementById('audio-btn');
        const tool = document.getElementById('custom-tool');
        const toolArt = document.getElementById('tool-art');

        let holes = [], moles = [], targets = [], lastHole = null;
        let timeUp = true, score = 0, combo = 0, timeLeft = 30;
        let countdownTimer, frenzyInterval = null, isMuted = false, bgmInterval = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const targetsData = {
            mole: { points: 1 },
            hedgehog: { points: 2 },
            frog: { points: 2 },
            robot: { points: 3 },
            alien: { points: 4 },
            carrot: { points: 2 },
            radish: { points: 2 },
            cat: { points: 3 },
            pumpkin: { points: 3 },
            tomato: { points: 2 }
        };

        const tools = {
            hammer: { points: 1, sound: 160 },
            mallet: { points: 2, sound: 125 },
            pan:    { points: 2, sound: 95 },
            gavel:  { points: 3, sound: 190 },
            toy:    { points: 1, sound: 260 },
            lightsaber: { points: 4, sound: 440 },
            broom:  { points: 1, sound: 110 },
            lightning: { points: 5, sound: 520 },
            axe:    { points: 3, sound: 140 }
        };

        function toggleMute(){
            isMuted = !isMuted;
            audioBtn.textContent = isMuted ? "🔇 Âm thanh: TẮT" : "🔊 Âm thanh: BẬT";
            if(isMuted) stopBGM(); else if(!timeUp) startBGM();
        }

        function playSound(freq,type,duration,gainVal){
            if(isMuted) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
            osc.type=type; osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
            gain.gain.setValueAtTime(gainVal,audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime+duration);
        }
        function playToolSound(){
            const t=tools[toolSelect.value] || tools.hammer;
            playSound(t.sound,'triangle',.08,.65);
            playSound(t.sound*.55,'square',.045,.18);
        }
        function playHitSound(){
            playSound(880 + combo*15,'sine',.12,.55);
        }
        function playGameOverSound(){ playSound(440,'sine',.8,.8); }

        const bgmNotes=[261.63,329.63,392,523.25,392,329.63]; let noteIdx=0;
        function playBGMNote(){
            if(isMuted || timeUp) return;
            playSound(bgmNotes[noteIdx],'sine',.2,.055);
            noteIdx=(noteIdx+1)%bgmNotes.length;
        }
        function startBGM(speed=220){ stopBGM(); bgmInterval=setInterval(playBGMNote,speed); }
        function stopBGM(){ if(bgmInterval){clearInterval(bgmInterval);bgmInterval=null;} }

        const gridConfigs={
            '6':{cols:3,rows:2},'9':{cols:3,rows:3},'12':{cols:4,rows:3},
            '15':{cols:5,rows:3},'18':{cols:6,rows:3},'21':{cols:7,rows:3},
            '24':{cols:8,rows:3},'27':{cols:9,rows:3},'30':{cols:10,rows:3}
        };
        const levels={
            easy:{min:1200,max:1800},medium:{min:700,max:1100},hard:{min:350,max:600}
        };

        /* ================= MỤC TIÊU 3D ĐỢT MỚI VỚI NÂNG CẤP ĐỒ HỌA ================= */
        function targetSVG(type){
            const common = `class="target target-face" viewBox="0 0 100 100"`;
            const svgs = {
                mole: `<svg ${common}>
                    <!-- Tai chuột -->
                    <circle cx="20" cy="22" r="14" fill="#6d4c41" stroke="#3e2723" stroke-width="3"/>
                    <circle cx="20" cy="22" r="8" fill="#ff8a80"/>
                    <circle cx="80" cy="22" r="14" fill="#6d4c41" stroke="#3e2723" stroke-width="3"/>
                    <circle cx="80" cy="22" r="8" fill="#ff8a80"/>
                    <!-- Đầu chuột -->
                    <ellipse cx="50" cy="58" rx="38" ry="34" fill="#8d6e63" stroke="#3e2723" stroke-width="3"/>
                    <!-- Mõm -->
                    <ellipse cx="50" cy="66" rx="24" ry="18" fill="#d7ccc8"/>
                    <!-- Mắt xịn long lanh -->
                    <circle cx="34" cy="48" r="7" fill="#212121"/>
                    <circle cx="32" cy="46" r="2.5" fill="#fff"/>
                    <circle cx="66" cy="48" r="7" fill="#212121"/>
                    <circle cx="64" cy="46" r="2.5" fill="#fff"/>
                    <!-- Má hồng -->
                    <ellipse cx="24" cy="58" rx="6" ry="4" fill="#ff5252" opacity=".6"/>
                    <ellipse cx="76" cy="58" rx="6" ry="4" fill="#ff5252" opacity=".6"/>
                    <!-- Mũi hồng 3D -->
                    <path d="M 44 58 Q 50 52 56 58 Q 50 65 44 58 Z" fill="#ff4081" stroke="#c2185b" stroke-width="1.5"/>
                    <rect x="47" y="63" width="6" height="6" fill="#fff" rx="1.5"/>
                    <!-- Râu -->
                    <path d="M 12 55 L 30 57 M 10 63 L 29 62 M 88 55 L 70 57 M 90 63 L 71 62" stroke="#3e2723" stroke-width="2.5" stroke-linecap="round"/>
                </svg>`,

                hedgehog: `<svg ${common}>
                    <!-- Gai nhím dày 3D -->
                    <path d="M 10 65 L 18 30 L 30 55 L 40 18 L 52 50 L 65 18 L 72 55 L 85 30 L 92 65 Z" fill="#3e2723" stroke="#1b0000" stroke-width="3"/>
                    <path d="M 14 62 L 24 38 L 34 58 L 48 28 L 58 52 L 70 28 L 78 58 L 86 38 Z" fill="#5d4037"/>
                    <!-- Mặt nhím -->
                    <ellipse cx="50" cy="65" rx="36" ry="28" fill="#d7ccc8" stroke="#3e2723" stroke-width="3"/>
                    <circle cx="35" cy="56" r="5" fill="#212121"/><circle cx="34" cy="54" r="2" fill="#fff"/>
                    <circle cx="65" cy="56" r="5" fill="#212121"/><circle cx="64" cy="54" r="2" fill="#fff"/>
                    <!-- Mũi nhím nhọn dễ thương -->
                    <ellipse cx="50" cy="66" rx="7" ry="5" fill="#212121"/>
                    <ellipse cx="48" cy="64" rx="2" ry="1.5" fill="#fff"/>
                    <path d="M 44 74 Q 50 79 56 74" fill="none" stroke="#5d4037" stroke-width="2.5" stroke-linecap="round"/>
                </svg>`,

                frog: `<svg ${common}>
                    <!-- Mắt ếch to nhô lên -->
                    <circle cx="28" cy="24" r="16" fill="#4caf50" stroke="#1b5e20" stroke-width="3"/>
                    <circle cx="72" cy="24" r="16" fill="#4caf50" stroke="#1b5e20" stroke-width="3"/>
                    <circle cx="28" cy="22" r="8" fill="#fff"/>
                    <circle cx="72" cy="22" r="8" fill="#fff"/>
                    <circle cx="29" cy="22" r="4" fill="#000"/>
                    <circle cx="73" cy="22" r="4" fill="#000"/>
                    <!-- Đầu & Thân ếch -->
                    <ellipse cx="50" cy="60" rx="40" ry="32" fill="#66bb6a" stroke="#1b5e20" stroke-width="3.5"/>
                    <ellipse cx="50" cy="68" rx="28" ry="18" fill="#dedede"/>
                    <!-- Má hồng ếch -->
                    <circle cx="24" cy="58" r="6" fill="#ff5252" opacity=".5"/>
                    <circle cx="76" cy="58" r="6" fill="#ff5252" opacity=".5"/>
                    <!-- Miệng cười rộng -->
                    <path d="M 32 60 Q 50 78 68 60" fill="none" stroke="#1b5e20" stroke-width="3.5" stroke-linecap="round"/>
                </svg>`,

                robot: `<svg ${common}>

        function changeTarget(){
            const type = targetSelect.value;
            holes.forEach(h => {
                const old = h.querySelector('.target');
                if(old) old.remove();
                h.insertAdjacentHTML('afterbegin', targetSVG(type));
            });
            targets = document.querySelectorAll('.target');
            moles = targets;
        }

        function fitGrid(){
            const count = holeCountSelect.value, config = gridConfigs[count];
            const cs = getComputedStyle(gameGrid);
            const gap = parseFloat(cs.gap) || 8;
            const pad = (parseFloat(cs.paddingLeft) || 10) * 2;
            const border = (parseFloat(cs.borderLeftWidth) || 0) * 2;
            const availableW = Math.max(24, Math.min(window.innerWidth * 0.96, 920) - pad - border - gap * (config.cols - 1));
            const availableH = Math.max(24, window.innerHeight * 0.58 - pad - border - gap * (config.rows - 1));
            const size = Math.max(24, Math.min(80, availableW / config.cols, availableH / config.rows));
            gameGrid.style.setProperty('--cell-size', `${Math.floor(size)}px`);
            gameGrid.style.gridTemplateColumns = `repeat(${config.cols}, var(--cell-size))`;
            gameGrid.style.gridTemplateRows = `repeat(${config.rows}, var(--cell-size))`;
        }

        function renderGrid(){
            const count = holeCountSelect.value;
            gameGrid.innerHTML = '';
            for(let i=0; i<parseInt(count); i++){
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.innerHTML = targetSVG(targetSelect.value);
                gameGrid.appendChild(hole);
            }
            holes = document.querySelectorAll('.hole');
            targets = document.querySelectorAll('.target');
            moles = targets;
            fitGrid();
        }

        function moveTool(x, y){
            tool.style.left = x + 'px';
            tool.style.top = y + 'px';
        }

        window.addEventListener('pointermove', e => {
            moveTool(e.clientX, e.clientY);
        }, {passive:true});

        function randomTime(min,max){ return Math.round(Math.random()*(max-min)+min); }
        function randomHole(list){
            if(list.length < 2) return list[0];
            let hole;
            do { hole = list[Math.floor(Math.random()*list.length)] } while(hole === lastHole);
            lastHole = hole; return hole;
        }

        function popMole(){
            if(timeUp) return;
            const level = difficultySelect.value, time = randomTime(levels[level].min, levels[level].max);
            const hole = randomHole(holes);
            if(!hole) return;
            hole.classList.add('up');
            setTimeout(() => {
                hole.classList.remove('up');
                if(!timeUp && timeLeft > 5) popMole();
            }, time);
        }

        function startFinalFeast(){
            timeLeftDisplay.classList.add('time-frenzy'); startBGM(110);
            frenzyInterval = setInterval(() => {
                if(timeUp) return;
                const countToPop = Math.min(Math.floor(holes.length/2), 5);
                for(let i=0; i<countToPop; i++){
                    const hole = randomHole(holes);
                    if(hole && !hole.classList.contains('up')){
                        hole.classList.add('up');
                        setTimeout(() => hole.classList.remove('up'), 650);
                    }
                }
            }, 300);
        }

        function startGame(){
            score = 0; combo = 0; timeLeft = 30; timeUp = false;
            scoreDisplay.textContent = '0'; comboDisplay.textContent = '0';
            timeLeftDisplay.textContent = '30'; timeLeftDisplay.classList.remove('time-frenzy');
            startBtn.disabled = true; holeCountSelect.disabled = true; difficultySelect.disabled = true; toolSelect.disabled = true; targetSelect.disabled = true;
            tool.style.display = 'block'; document.body.classList.add('playing');
            startBGM(220); popMole();

            countdownTimer = setInterval(() => {
                timeLeft--; timeLeftDisplay.textContent = timeLeft;
                if(timeLeft === 5) startFinalFeast();
                if(timeLeft <= 0){
                    clearInterval(countdownTimer);
                    if(frenzyInterval) clearInterval(frenzyInterval);
                    timeUp = true; stopBGM(); playGameOverSound();
                    timeLeftDisplay.classList.remove('time-frenzy');
                    holes.forEach(h => h.classList.remove('up'));
                    startBtn.disabled = false; holeCountSelect.disabled = false; difficultySelect.disabled = false; toolSelect.disabled = false; targetSelect.disabled = false;
                    tool.style.display = 'none'; document.body.classList.remove('playing');
                    setTimeout(() => alert(`🎉 HẾT GIỜ! Thành tích VIP PRO 3D: ${score} điểm!`), 50);
                }
            }, 1000);
        }

        function createSparks(x,y){
            for(let i=0; i<10; i++){
                const spark = document.createElement('div'); spark.className = 'spark';
                spark.style.left = x + 'px'; spark.style.top = y + 'px';
                const angle = Math.random()*Math.PI*2, speed = 30 + Math.random()*55;
                spark.style.setProperty('--dx', `${Math.cos(angle)*speed}px`);
                spark.style.setProperty('--dy', `${Math.sin(angle)*speed}px`);
                document.body.appendChild(spark); setTimeout(() => spark.remove(), 400);
            }
        }

        function showScore(x,y,amount){
            const pop = document.createElement('div'); pop.className = 'score-pop';
            pop.textContent = `+${amount}`;
            pop.style.left = x + 'px'; pop.style.top = y + 'px';
            document.body.appendChild(pop); setTimeout(() => pop.remove(), 650);
        }

        function isColliding(a,b){
            return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
        }

        function smashTool(){
            if(timeUp) return;
            tool.classList.add('smash'); playToolSound();
            setTimeout(() => tool.classList.remove('smash'), 100);

            const toolRect = tool.getBoundingClientRect();
            let hitSomething = false;
            moles.forEach(mole => {
                const hole = mole.parentElement;
                if(hole.classList.contains('up') && !mole.classList.contains('hit')){
                    const moleRect = mole.getBoundingClientRect();
                    if(isColliding(toolRect, moleRect)){
                        hitSomething = true;
                        const t = tools[toolSelect.value] || tools.hammer;
                        const targetBonus = (targetsData[targetSelect.value] || {points:1}).points; 
                        const points = targetBonus + t.points - 1 + Math.min(combo, 5);
                        score += points; combo++;
                        scoreDisplay.textContent = score; comboDisplay.textContent = combo;
                        playHitSound();
                        mole.classList.add('hit');
                        
                        createSparks(moleRect.left + moleRect.width/2, moleRect.top + moleRect.height/2);
                        showScore(moleRect.left + moleRect.width/2, moleRect.top, points);
                        setTimeout(() => {
                            hole.classList.remove('up'); mole.classList.remove('hit');
                        }, 220);
                    }
                }
            });
            if(!hitSomething){
                combo = 0; comboDisplay.textContent = '0';
            }
        }

        window.addEventListener('mousedown', smashTool);
        window.addEventListener('keydown', e => {
            if(e.code === 'Space'){ e.preventDefault(); smashTool(); }
        });

        renderGrid();
        changeTool();
