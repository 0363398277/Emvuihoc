<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galaxy Shooter - 40 Boss Edition</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040b;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* =====================================================
   PLAYER UI
===================================================== */

#ui{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.playerUI{
    position:relative;

    min-width:190px;

    padding:12px 15px;

    background:
        linear-gradient(
            135deg,
            rgba(5,25,43,.96),
            rgba(2,8,18,.94)
        );

    border:1px solid rgba(69,221,255,.45);

    border-radius:16px;

    box-shadow:
        0 0 12px rgba(0,220,255,.12),
        inset 0 0 20px rgba(0,180,255,.06);

    overflow:hidden;

    backdrop-filter:blur(8px);
}

.playerUI.p2{

    border-color:
        rgba(255,72,157,.55);

    text-align:right;

    box-shadow:
        0 0 12px rgba(255,50,150,.14),
        inset 0 0 20px rgba(255,50,150,.06);
}

.playerName{
    font-size:12px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;

    text-shadow:
        0 0 8px currentColor;
}
.p1name{color:#45ddff}
.p2name{color:#ff668c}

.row{

    display:flex;

    gap:24px;

    margin-top:8px;

    align-items:flex-end;
}

.playerUI::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:45%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #45ddff,
            transparent
        );

    box-shadow:
        0 0 10px #45ddff;
}


.playerUI.p2::before{

    left:auto;
    right:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff489d,
            transparent
        );

    box-shadow:
        0 0 10px #ff489d;
}

.p2 .row{
    justify-content:flex-end;
}

.stat b{

    display:block;

    margin-top:2px;

    font-size:22px;

    font-weight:900;

    letter-spacing:1px;

    text-shadow:
        0 0 8px currentColor;
}

.stat small{

    display:block;

    color:#7895a8;

    font-size:8px;

    font-weight:bold;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

.playerUI .stat:last-child b{

    color:#ffffff;

    min-width:28px;

    text-align:center;

    padding:2px 7px;

    border-radius:8px;

    background:
        rgba(69,221,255,.08);

    border:
        1px solid rgba(69,221,255,.2);
}

.playerUI.p2 .stat:last-child b{

    background:
        rgba(255,72,157,.08);

    border-color:
        rgba(255,72,157,.2);
}

/* =====================================================
   TOP CENTER
===================================================== */

#topCenterUI{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:15;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    pointer-events:none;
}

#levelDisplay{
    min-width:94px;
    padding:8px 13px;
    text-align:center;
    background:rgba(3,12,22,.9);
    border:1px solid #28566d;
    border-radius:20px;
    color:#7deaff;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    box-shadow:0 0 20px rgba(0,210,255,.15);
}

/* =====================================================
   CIRCLE
===================================================== */

.bossCircle{
    position:relative;
    width:56px;
    height:56px;
    flex:none;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(8,25,38,.95),
            rgba(3,9,16,.95)
        );
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 15px rgba(0,200,255,.12);
}

.bossCircle svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:rotate(-90deg);
}

.bossCircle circle{
    fill:none;
    stroke-width:4;
}

.circleBG{
    stroke:#162b39;
}

.circleFill{
    stroke:#36e0ff;
    stroke-linecap:round;
    stroke-dasharray:138.23;
    stroke-dashoffset:138.23;
    transition:stroke-dashoffset .12s linear,stroke .3s;
}

.circleText{
    position:relative;
    z-index:2;
    text-align:center;
    font-size:10px;
    font-weight:bold;
    line-height:1.1;
}

.circleText small{
    display:block;
    margin-top:2px;
    color:#718897;
    font-size:6px;
    letter-spacing:.6px;
}

#bossProgressBox{
    position:static;
    width:auto;
}

#bossUI{
    position:static;
    width:auto;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

#bossUI.active{
    opacity:1;
}

#bossHP{
    position:relative;
    width:56px;
    height:56px;
    background:transparent;
    border:none;
    overflow:visible;
}

#bossHPFill{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:none!important;
    border:none;
    border-radius:50%;
    --boss-hp-angle:360deg;
    --boss-color:#ff315f;
}

#bossHPFill::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
        conic-gradient(
            var(--boss-color,#ff315f)
            var(--boss-hp-angle),
            transparent
            var(--boss-hp-angle)
        );

    -webkit-mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 4px),
            #000 calc(100% - 3px)
        );

    mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 4px),
            #000 calc(100% - 3px)
        );

    filter:
        drop-shadow(
            0 0 5px
            var(--boss-color,#ff315f)
        );
}

#bossHPFill::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(10,12,20,.95),
            rgba(3,7,13,.95)
        );
}

#bossHPFill .circleText{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:2;
}

/* =====================================================
   WARNING
===================================================== */

#bossWarning{
    position:fixed;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:#ff5577;
    font-size:18px;
    font-weight:bold;
    letter-spacing:4px;
    text-shadow:
        0 0 10px #ff174f,
        0 0 25px #ff174f;
    opacity:0;
    pointer-events:none;
}

#bossWarning.show{
    animation:
        bossWarningAnim .6s infinite alternate;
}

@keyframes bossWarningAnim{
    from{
        opacity:.3;
        transform:translateX(-50%) scale(.95);
    }

    to{
        opacity:1;
        transform:translateX(-50%) scale(1.05);
    }
}

/* =====================================================
   SOUND
===================================================== */

#soundButton{
    position:fixed;
    right:14px;
    bottom:45px;
    z-index:20;
    width:42px;
    height:42px;
    padding:0;
    border-radius:50%;
    font-size:18px;
    background:rgba(5,15,25,.9);
}

/* =====================================================
   HELP
===================================================== */

#help{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    padding:7px 15px;
    border-radius:20px;
    background:rgba(3,10,18,.8);
    border:1px solid #183248;
    color:#8196a6;
    font-size:11px;
    pointer-events:none;
}

/* =====================================================
   SCREENS
===================================================== */

.screen{
    position:fixed;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(1,4,10,.9);
    backdrop-filter:blur(7px);
}

.panel{
    width:min(94vw,540px);
    padding:30px;
    text-align:center;
    background:
        linear-gradient(
            145deg,
            #0b1c2d,
            #030911
        );
    border:1px solid #24506a;
    border-radius:20px;
    box-shadow:0 0 70px rgba(0,200,255,.13);
}

.panel h1{
    color:#53e5ff;
    font-size:36px;
    letter-spacing:4px;
    text-shadow:0 0 20px #00c8ff;
    margin-bottom:12px;
}

.panel h2{
    color:#ff5c78;
    font-size:35px;
}

.panel p{
    color:#91a6b5;
    line-height:1.6;
}

.buttons{
    display:grid;
    gap:10px;
    margin-top:22px;
}

button{
    padding:13px;
    background:#0a1b2b;
    border:1px solid #28566d;
    border-radius:10px;
    color:#6de7ff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#55ddff;
    color:#021019;
    box-shadow:0 0 20px #55ddff;
}

button span{
    display:block;
    margin-top:4px;
    color:#718b9c;
    font-size:11px;
    font-weight:normal;
}

#gameOver{
    display:none;
}

.finalScore{
    margin:20px 0;
    font-size:22px;
    line-height:1.8;
}

.hidden{
    display:none!important;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .playerUI{
        min-width:125px;
        padding:7px 9px;
    }

    .panel{
        padding:24px 17px;
    }

    .panel h1{
        font-size:28px;
    }

    #topCenterUI{
        top:9px;
        gap:5px;
    }

    #levelDisplay{
        min-width:76px;
        padding:7px 8px;
        font-size:10px;
        letter-spacing:1.5px;
    }

    .bossCircle,
    #bossHP{
        width:47px;
        height:47px;
    }

    .circleText{
        font-size:9px;
    }

    .circleText small{
        font-size:5px;
    }
}

@media(max-width:380px){

    #ui{
        top:8px;
        left:7px;
        right:7px;
    }

    .playerUI{
        min-width:105px;
        padding:6px 7px;
    }

    .playerName{
        font-size:10px;
    }

    .stat b{
        font-size:15px;
    }

    #topCenterUI{
        top:65px;
    }

    #bossWarning{
        top:125px;
        font-size:14px;
    }
}

===================================================== */

let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;

let soundEnabled = true;
let musicTimer = null;
let musicStep = 0;

let lastSfxTime = 0;

function initAudio(){

    if(audioCtx){

        if(audioCtx.state === "suspended")
            audioCtx.resume();

        return;
    }

    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    masterGain = audioCtx.createGain();
    musicGain = audioCtx.createGain();
    sfxGain = audioCtx.createGain();

    masterGain.gain.value = .8;
    musicGain.gain.value = .9;
    sfxGain.gain.value = 1.5;

    musicGain.connect(masterGain);
    sfxGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    startMusic();
}


function tone(
    frequency,
    duration,
    type="sine",
    volume=.1,
    slide=0,
    destination=sfxGain
){

    if(
        !audioCtx ||
        !soundEnabled
    )
        return;

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;

    osc.frequency.setValueAtTime(
        frequency,
        now
    );

    if(slide){

        osc.frequency.exponentialRampToValueAtTime(
            Math.max(
                20,
                frequency + slide
            ),
            now + duration
        );
    }

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + .008
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
    );

    osc.connect(gain);
    gain.connect(destination);

    osc.start(now);
    osc.stop(now + duration + .02);
}

   SOUND RATE LIMIT

function limitedHitSound(){

    const now = performance.now();

    if(now - lastSfxTime < 55)

    lastSfxTime = now;

    tone(

        .035,
        70
    );
}

function soundExplosion(big=false){

    if(!audioCtx || !soundEnabled)
        return;

    const now = audioCtx.currentTime;

    const boom =
        audioCtx.createOscillator();

    const boomGain =
        audioCtx.createGain();

    boom.type = "sine";

    boom.frequency.setValueAtTime(
        big ? 95 : 125,
        now
    );

    boom.frequency.exponentialRampToValueAtTime(
        big ? 38 : 55,
        now + (big ? .42 : .28)
    );

    boomGain.gain.setValueAtTime(
        .0001,
        now
    );

    boomGain.gain.exponentialRampToValueAtTime(
        big ? .25 : .14,
        now + .015
    );

    boomGain.gain.exponentialRampToValueAtTime(
        .0001,
        now + (big ? .48 : .32)
    );

    boom.connect(boomGain);
    boomGain.connect(sfxGain);

    boom.start(now);
    boom.stop(now + .5);

    tone(
        big ? 260 : 320,
        .22,
        "triangle",
        big ? .10 : .07,
        -170
    );
}

const musicNotes = [
    110,
    138.59,
    164.81,
    138.59,
    98,
    123.47,
    146.83,
    123.47
];

function startMusic(){

    if(musicTimer)
        return;

    musicStep = 0;

    musicTimer =
        setInterval(() => {

            if(!audioCtx || !soundEnabled)
                return;

            const note =
                musicNotes[
                    musicStep %
                    musicNotes.length
                ];

            tone(
                note,
                .45,
                "sine",
                .045,
                0,
                musicGain
            );

            if(musicStep % 4 === 0){

                tone(
                    note/2,
                    .7,
                    "triangle",
                    .025,
                    0,
                    musicGain
                );
            }

            musicStep++;

        },520);
}

function makePlayer(x,color){

    return {

        x,
        y:H-75,

        color,

        // MẠNG HIỆN CÓ
        hp:3,

        // SỨC CHỨA MẠNG
        hpMax:5,

        speed:7,

        cooldown:0,

        rapid:0,
        rapidMax:600,

        power:0,
        powerMax:600,

        shooting:false,

        targetX:null,

        alive:true
    };
}

/* =====================================================
   START
===================================================== */

function startGame(selected){

    initAudio();

    mode = selected;

    resetGame();

    running = true;

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("gameOver")
        .style.display = "none";

    if(mode === "mouse"){

        document.getElementById("help").textContent =
            "🖱️ Di chuyển chuột • GIỮ CLICK để bắn • ↑ AUTO FIRE";

    }
    else if(mode === "keyboard"){

        document.getElementById("help").textContent =
            "⌨️ A/D hoặc ←/→ • SPACE bắn • ↑ AUTO FIRE";

    }
    else{

        document.getElementById("help").textContent =
            "👥 P1: A/D + SPACE + W AUTO • P2: ←/→ + ENTER + ↑ AUTO";
    }

    lastTime = performance.now();

    requestAnimationFrame(loop);
}


function restartGame(){
    startGame(mode);
}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    autoFire1 = false;
    autoFire2 = false;

    bullets = [];
    enemyBullets = [];
    enemies = [];
    items = [];
    particles = [];

    level = 1;

    bossProgress = 0;
    bossState = "charge";

    bossChargeStartTime =
        performance.now();

    boss = null;

    bossIndex = -1;
    previousBossIndex = -1;

    spawnTimer = 0;

    shake = 0;

    player1 =
        makePlayer(
            W*.35,
            "#48e4ff"
        );

    player2 = null;

    if(mode === "two"){

        player1.x = W*.30;

        player2 =
            makePlayer(
                W*.70,
                "#ff668c"

    }

    updateUI();
    updateBossProgressUI();
    hideBossUI();

        "levelDisplay"

}

/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};

addEventListener("keydown",e => {

    if(
        e.code === "ArrowUp" &&
        mode !== "two" &&
        !e.repeat
    ){

        autoFire1 = !autoFire1;

        e.preventDefault();

        return;
    }

    if(
        e.code === "KeyW" &&
        mode === "two" &&
        !e.repeat
    ){

        autoFire1 = !autoFire1;

        e.preventDefault();

        return;
    }

    if(
        e.code === "ArrowUp" &&
        mode === "two" &&
        !e.repeat
    ){

        autoFire2 = !autoFire2;

        e.preventDefault();

        return;
    }

    keys[e.code] = true;

    if(
        e.code === "Space" ||
        e.code === "Enter" ||
        e.code === "NumpadEnter" ||
        e.code === "ArrowLeft" ||
        e.code === "ArrowRight"
    ){

        e.preventDefault();
    }

});

addEventListener("keyup",e => {
    keys[e.code] = false;
});


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener("mousemove",e => {

    if(
        running &&
        mode === "mouse" &&
        player1
    ){

        player1.targetX = e.clientX;
    }

});

canvas.addEventListener("mousedown",e => {

    if(
        e.button === 0 &&
        running &&
        mode === "mouse"
    ){

        player1.shooting = true;
    }

});

addEventListener("mouseup",() => {

    if(player1)
        player1.shooting = false;

});


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(p,id,dt){

    if(!p || !p.alive)
        return;

    if(
        mode === "mouse" &&
        id === 1
    ){

        if(p.targetX !== null){

            const diff =
                p.targetX - p.x;

            p.x +=
                diff *
                (1 - Math.pow(.0008,dt));
        }
    }

    if(mode === "keyboard"){

        if(
            keys["KeyA"] ||
            keys["ArrowLeft"]
        )
            p.x -= p.speed*dt;

        if(
            keys["KeyD"] ||
            keys["ArrowRight"]
        )
            p.x += p.speed*dt;
    }

    if(mode === "two"){

        if(id === 1){

            if(keys["KeyA"])
                p.x -= p.speed*dt;

            if(keys["KeyD"])
                p.x += p.speed*dt;
        }

        if(id === 2){

            if(keys["ArrowLeft"])
                p.x -= p.speed*dt;

            if(keys["ArrowRight"])
                p.x += p.speed*dt;
        }
    }

    p.x =
        Math.max(
            28,
            Math.min(W-28,p.x)
        );

    let shoot = false;

    if(
        mode === "mouse" &&
        id === 1
    ){

        shoot =
            p.shooting ||
            autoFire1;
    }

    else if(mode === "keyboard"){

        shoot =
            keys["Space"] ||
            autoFire1;
    }

    else if(mode === "two"){

        if(id === 1){

            shoot =
                keys["Space"] ||
                autoFire1;
        }

        if(id === 2){

            shoot =
                keys["Enter"] ||
                keys["NumpadEnter"] ||
                autoFire2;
        }
    }

    if(shoot)
        shootPlayer(p);

    p.cooldown =
        Math.max(
            0,
            p.cooldown-dt
        );

    p.rapid =
        Math.max(
            0,
            p.rapid-dt
        );

    p.shield =
        Math.max(
            0,
            p.shield-dt
        );

    p.power =
        Math.max(
            0,
            p.power-dt
        );
}


/* =====================================================
   SHOOT
===================================================== */

function shootPlayer(p){

    if(
        !p.alive ||
        p.cooldown > 0
    )
        return;

    p.cooldown =
        p.rapid > 0 ? 3 : 8;

    soundShoot();

    const amount =
        p.power > 0 ? 3 : 1;

    if(amount === 1){

        bullets.push({

            x:p.x,
            y:p.y-27,

            vy:-14,

            owner:p,

            damage:1,

            color:p.color
        });

    }
    else{

        bullets.push({

            x:p.x-9,
            y:p.y-25,

            vy:-14,

            owner:p,

            damage:2,

            color:"#ffe066"
        });

        bullets.push({

            x:p.x,
            y:p.y-30,

            vy:-15,

            owner:p,

            damage:2,

            color:"#ffffff"
        });

        bullets.push({

            x:p.x+9,
            y:p.y-25,

            vy:-14,

            owner:p,

            damage:2,

            color:"#ffe066"
        });
    }
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b = bullets[i];

        b.y += b.vy*dt;

        if(b.y < -50)
            bullets.splice(i,1);
    }
}


function drawBullets(){

    ctx.save();

    for(const b of bullets){

        ctx.shadowBlur = 18;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;

        ctx.fillRect(
            b.x-2,
            b.y-13,
            4,
            18
        );
    }

    ctx.restore();
}


/* =====================================================
   ENEMY BULLETS
===================================================== */

function updateEnemyBullets(dt){

    const players =
        player2
            ? [player1,player2]
            : [player1];

    for(
        let i=enemyBullets.length-1;
        i>=0;
        i--
    ){

        const b = enemyBullets[i];

        b.x += b.vx*dt;
        b.y += b.vy*dt;

        let hit = false;

        for(const p of players){

            if(!p || !p.alive)
                continue;

            const dx = b.x-p.x;
            const dy = b.y-p.y;

            const d2 =
                dx*dx +
                dy*dy;

            const radius =
                b.radius+16;

            if(d2 < radius*radius){

                damagePlayer(p);

                enemyBullets.splice(i,1);

                hit = true;

                break;
            }
        }

        if(hit)
            continue;

        if(
            b.x < -120 ||
            b.x > W+120 ||
            b.y < -120 ||
            b.y > H+120
        ){

            enemyBullets.splice(i,1);
        }
    }
}


function drawEnemyBullets(){

    ctx.save();

    for(const b of enemyBullets){

        ctx.translate(
            b.x,
            b.y
        );

        ctx.rotate(
            Math.atan2(
                b.vy,
                b.vx
            )
        );

        ctx.shadowBlur = 15;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            b.radius*2.2,
            b.radius,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.setTransform(1,0,0,1,0,0);
    }

    ctx.restore();
}


/* =====================================================
   NORMAL ENEMIES
===================================================== */

function spawnEnemy(){

    if(
        bossState !== "charge" ||
        enemies.length >= MAX_ENEMIES
    )
        return;

    const random = Math.random();

    if(random < .55){

        enemies.push({

            type:"virus",

            x:
                30+
                Math.random()*(W-60),

            y:-40,

            radius:
                15+
                Math.random()*5,

            hp:1,
            maxHp:1,

            speed:
                2+
                Math.random()*1.7,

            phase:
                Math.random()*6.28,

            age:0,

            rotation:
                Math.random()*6.28
        });

    }

    else if(random < .85){

        const size =
            36+
            Math.random()*16;

        const rockSeed =
            Math.random();

        enemies.push({

            type:"rock",

            x:
                size+
                Math.random()*
                (W-size*2),

            y:
                -size-20,

            radius:size,

            hp:3,
            maxHp:5,

            speed:
                .7+
                Math.random()*.8,

            vx:
                (Math.random()-.5)*1.5,

            rotation:
                Math.random()*6.28,

            rotationSpeed:
                (Math.random()-.5)*.04,

            seed:rockSeed,

            age:0
        });

    }
    else{

        spawnAlienShip();
    }
}


function spawnAlienShip(){

    if(
        bossState !== "charge" ||
        enemies.length >= MAX_ENEMIES
    )
        return;

    const fromLeft =
        Math.random()<.5;

    enemies.push({

        type:"alien",

        x:
            fromLeft
                ? -70
                : W+70,

        y:
            100+
            Math.random()*
            Math.min(
                260,
                H*.45
            ),

        radius:25,

        hp:3,
        maxHp:3,

        speed:
            1.7+
            Math.random()*1.2,

        vx:
            fromLeft ? 1 : -1,

        phase:
            Math.random()*6.28,

        age:0
    });
}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function updateEnemies(dt){

    const players =
        player2
            ? [player1,player2]
            : [player1];

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e = enemies[i];

        e.age += dt;

        if(e.type === "virus"){

            e.y += e.speed*dt;

            e.x +=
                Math.sin(
                    e.age*.13+
                    e.phase
                )*
                3*
                dt;

            e.rotation += .05*dt;
        }

        else if(e.type === "rock"){

            e.y += e.speed*dt;
            e.x += e.vx*dt;
            e.rotation += e.rotationSpeed*dt;

            if(
                e.x < e.radius ||
                e.x > W-e.radius
            )
                e.vx *= -1;
        }

        else if(e.type === "alien"){

            e.x +=
                e.vx*
                e.speed*
                dt;

            e.y +=
                Math.sin(
                    e.age*.08+
                    e.phase
                )*
                2.2*
                dt;
        }

        let hitPlayer = false;

        for(const p of players){

            if(!p || !p.alive)
                continue;

            const dx = e.x-p.x;
            const dy = e.y-p.y;

            const distance =
                Math.hypot(dx,dy);

            if(
                distance <
                e.radius+19
            ){

                enemies.splice(i,1);

                damagePlayer(p);

                hitPlayer = true;

                break;
            }
        }

        if(hitPlayer)
            continue;

        for(
            let j=bullets.length-1;
            j>=0;
            j--
        ){

            const b = bullets[j];

            const dx = e.x-b.x;
            const dy = e.y-b.y;

            const distance =
                Math.hypot(dx,dy);

            if(
                distance <
                e.radius+7
            ){

                bullets.splice(j,1);

                e.hp -= b.damage;

                limitedHitSound();

                createParticles(
                    b.x,
                    b.y,
                    e.type === "alien"
                        ? "#8d7aff"
                        : e.type === "virus"
                            ? "#ff4d91"
                            : "#aab3bb",
                    5
                );

                if(e.hp <= 0){

                    destroyEnemy(
                        e,
                        b.owner
                    );

                    enemies.splice(i,1);
                }

                break;
            }
        }

        if(
            e.type === "virus" &&
            e.y > H+60
        )
            enemies.splice(i,1);

        if(
            e.type === "rock" &&
            e.y > H+80
        )
            enemies.splice(i,1);

        if(
            e.type === "alien" &&
            (
                e.x < -120 ||
                e.x > W+120
            )
        )
            enemies.splice(i,1);
    }
}


/* =====================================================
   PLAYER DAMAGE
===================================================== */

function damagePlayer(p){

    if(p.shield > 0){

        p.shield = 0;

        limitedHitSound();

        createParticles(
            p.x,
            p.y,
            "#55ff99",
            18
        );

        return;
    }

    p.hp--;

    shake = 12;

    soundDamage();

    createParticles(
        p.x,
        p.y,
        p.color,
        22
    );

    updateUI();

    if(p.hp <= 0){

        p.alive = false;

        soundExplosion(true);
    }

    if(player2){

        if(
            !player1.alive &&
            !player2.alive
        )
            endGame();

    }
    else{

        if(!player1.alive)
            endGame();
    }
}


/* =====================================================
   ENEMY DESTROY
===================================================== */

function destroyEnemy(e,owner){

    let points = 0;

    if(e.type === "virus")
        points = 20;

    else if(e.type === "rock")
        points = 100;

    else
        points = 150;

    if(owner)
        owner.score += points;

    const dropChance =
        e.type === "alien"
            ? .65
            : .35;

    if(
        Math.random() <
        dropChance
    ){

        spawnItem(
            e.x,
            e.y
        );
    }

    soundExplosion(
        e.type === "alien" ||
        e.type === "rock"
    );

    createParticles(
        e.x,
        e.y,
        e.type === "alien"
            ? "#8c72ff"
            : e.type === "virus"
                ? "#ff4d91"
                : "#aeb8c0",
        e.type === "rock"
            ? 25
            : 18
    );

    shake = 6;

    updateUI();
}


/* =====================================================
   DRAW ENEMIES
===================================================== */

function drawEnemies(){

    for(const e of enemies){

        ctx.save();

        ctx.translate(
            e.x,
            e.y
        );

        if(e.type === "virus"){

            ctx.rotate(e.rotation);

            drawVirus(e);
        }

        else if(e.type === "rock"){

            ctx.rotate(e.rotation);

            drawRock(e);
        }

        else{

            drawAlienShip(e);
        }

        ctx.restore();
    }
}


/* =====================================================
   VIRUS
===================================================== */

function drawVirus(e){

    ctx.shadowBlur = 18;
    ctx.shadowColor = "#ff2e88";

    ctx.strokeStyle = "#ff4d91";
    ctx.lineWidth = 3;

    for(let i=0;i<10;i++){

        const a =
            i/10*
            Math.PI*2;

        ctx.beginPath();

        ctx.moveTo(
            Math.cos(a)*8,
            Math.sin(a)*8
        );

        ctx.lineTo(
            Math.cos(a)*
            (e.radius+7),
            Math.sin(a)*
            (e.radius+7)
        );

        ctx.stroke();
    }

    ctx.fillStyle = "#d92972";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        e.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle = "#ff75ac";

    ctx.beginPath();

    ctx.arc(
        -4,
        -5,
        e.radius*.35,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle = "#180714";

    ctx.beginPath();

    ctx.arc(
        -5,
        -2,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        5,
        -2,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =====================================================
   ROCK - KHÔNG RANDOM MỖI FRAME
===================================================== */

function drawRock(e){

    ctx.shadowBlur = 14;
    ctx.shadowColor = "#7d8992";

    ctx.fillStyle = "#59646e";
    ctx.strokeStyle = "#adb8c0";
    ctx.lineWidth = 3;

    const points = 9;

    ctx.beginPath();

    for(let i=0;i<points;i++){

        const angle =
            i/points*
            Math.PI*2;

        /*
            Seed cố định.
            Không còn Math.random()
            trong mỗi frame.
        */

        const variation =
            .88 +
            Math.sin(
                i*4.1+
                e.seed*20
            )*.08;

        const radius =
            e.radius*
            variation;

        const x =
            Math.cos(angle)*radius;

        const y =
            Math.sin(angle)*radius;

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);
    }

    ctx.closePath();

    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#3d474e";

    const craters = [
        [-.3,-.2,.18],
        [.28,-.12,.13],
        [.05,.30,.16],
        [.34,.30,.09]
    ];

    for(const c of craters){

        ctx.beginPath();

        ctx.arc(
            c[0]*e.radius,
            c[1]*e.radius,
            c[2]*e.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    if(e.hp < e.maxHp){

        const width =
            e.radius*1.5;

        ctx.fillStyle =
            "rgba(0,0,0,.6)";

        ctx.fillRect(
            -width/2,
            -e.radius-12,
            width,
            5
        );

        ctx.fillStyle = "#ff536d";

        ctx.fillRect(
            -width/2,
            -e.radius-12,
            width*
            (e.hp/e.maxHp),
            5
        );
    }
}

/* =====================================================
   ITEMS - SCI-FI HOLOGRAPHIC
===================================================== */

function spawnItem(x,y){

    const types = [

        {
            type:"heal",
            color:"#ff315f",
            icon:"♥",
            label:"HP"
        },

        {
            type:"rapid",
            color:"#ffe45c",
            icon:"ϟ",
            label:"RAPID"
        },

        {
            type:"shield",
            color:"#55ff7a",
            icon:"⬡",
            label:"SHIELD"
        },

        {
            type:"power",
            color:"#ff4fd8",
            icon:"➤",
            label:"AMMO"
        }
    ];

    const t =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];

    items.push({

        x,
        y,

        radius:15,

        speed:1.7,

        phase:
            Math.random() *
            Math.PI * 2,

        /*
            Chỉ dùng cho vòng ngoài.
            Icon bên trong KHÔNG dùng rotation này.
        */
        rotation:
            Math.random() *
            Math.PI * 2,

        rotationSpeed:
            .025 +
            Math.random() * .02,

        ...t
    });
}


function updateItems(dt){

    for(
        let i=items.length-1;
        i>=0;
        i--
    ){

        const item = items[i];

        item.y += item.speed*dt;

        item.phase += .08*dt;

        item.rotation +=
            item.rotationSpeed*dt;

        const players =
            player2
                ? [player1,player2]
                : [player1];

        let collected = false;

        for(const p of players){

            if(!p || !p.alive)
                continue;

            const dx =
                p.x-item.x;

            const dy =
                p.y-item.y;

            const distance =
                Math.hypot(dx,dy);

            /*
                Hút vật phẩm khi người chơi
                tiến lại gần.
            */

            if(distance < 110){

                const magnet =
                    .025*dt;

                item.x += dx*magnet;
                item.y += dy*magnet;
            }

            if(
                distance <
                item.radius+20
            ){

                collectItem(
                    item,
                    p
                );

                items.splice(i,1);

                collected = true;

                break;
            }
        }

        if(collected)
            continue;

        if(item.y > H+50)
            items.splice(i,1);
    }
}


function collectItem(item,p){

    if(item.type === "heal"){

    p.hp =
        Math.min(
            p.hpMax,
            p.hp + 1
        );

}

    if(item.type === "rapid"){

    p.rapid =
        Math.min(
            p.rapidMax,
            p.rapid + 600
        );

}

if(item.type === "shield"){

    p.shield =
        Math.min(
            p.shieldMax,
            p.shield + 600
        );

}

if(item.type === "power"){

    p.power =
        Math.min(
            p.powerMax,
            p.power + 600
        );

}

if(item.type === "damage"){

    p.damageBoost =
        Math.min(
            p.damageBoostMax,
            p.damageBoost + 600
        );

}

    soundItem();

    createParticles(
        p.x,
        p.y,
        item.color,
        22
    );

    updateUI();
}


/* =====================================================
   DRAW ITEM
===================================================== */

function drawItems(){

    for(const item of items){

        ctx.save();

        ctx.translate(
            item.x,
            item.y
        );

        const pulse =
            1 +
            Math.sin(item.phase) * .12;


        /*
        =================================================
        OUTER ENERGY FIELD
        Không xoay
        =================================================
        */

        ctx.globalAlpha = .12;

        ctx.shadowBlur = 30;
        ctx.shadowColor = item.color;

        ctx.fillStyle = item.color;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            34 * pulse,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
        =================================================
        OUTER ROTATING RINGS
        CHỈ PHẦN NÀY XOAY
        =================================================
        */

        ctx.globalAlpha = .75;

        ctx.shadowBlur = 20;
        ctx.shadowColor = item.color;

        ctx.strokeStyle = item.color;
        ctx.lineWidth = 1.5;

        ctx.setLineDash([
            5,
            5
        ]);

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            25,
            item.rotation,
            item.rotation + Math.PI * 1.65
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            25,
            item.rotation + Math.PI,
            item.rotation + Math.PI * 2.65
        );

        ctx.stroke();

        ctx.setLineDash([]);


        /*
        =================================================
        INNER STATIC RING
        Không xoay
        =================================================
        */

        ctx.globalAlpha = .95;

        ctx.shadowBlur = 20;
        ctx.shadowColor = item.color;

        ctx.strokeStyle = item.color;
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            17,
            0,
            Math.PI * 2
        );

        ctx.stroke();


        /*
        =================================================
        ITEM CORE
        Không xoay
        =================================================
        */

        ctx.globalAlpha = 1;

        const gradient =
            ctx.createRadialGradient(
                -4,
                -5,
                1,
                0,
                0,
                17
            );

        gradient.addColorStop(
            0,
            "#ffffff"
        );

        gradient.addColorStop(
            .18,
            item.color
        );

        gradient.addColorStop(
            .65,
            item.color
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,.15)"
        );

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            15 * pulse,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
        =================================================
        ICON
        QUAN TRỌNG:
        Không ctx.rotate() ở đây.
        Icon luôn đứng thẳng.
        =================================================
        */

        ctx.shadowBlur = 16;
        ctx.shadowColor = "#ffffff";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";


        /* =============================================
           HP
        ============================================= */

        if(item.type === "heal"){

            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#ffb0c5";
            ctx.lineWidth = 1.5;

            ctx.beginPath();

            ctx.moveTo(0,10);

            ctx.bezierCurveTo(
                -3,7,
                -11,2,
                -11,-4
            );

            ctx.bezierCurveTo(
                -11,-10,
                -4,-12,
                0,-6
            );

            ctx.bezierCurveTo(
                4,-12,
                11,-10,
                11,-4
            );

            ctx.bezierCurveTo(
                11,2,
                3,7,
                0,10
            );

            ctx.closePath();

            ctx.fill();
            ctx.stroke();
        }


        /* =============================================
           RAPID FIRE
        ============================================= */

        else if(item.type === "rapid"){

            ctx.fillStyle = "#fff";

            ctx.beginPath();

            ctx.moveTo(4,-12);
            ctx.lineTo(-7,0);
            ctx.lineTo(-1,0);
            ctx.lineTo(-5,12);
            ctx.lineTo(8,-3);
            ctx.lineTo(2,-3);

            ctx.closePath();

            ctx.fill();

            /*
                Lớp vàng nhỏ tạo cảm giác năng lượng
            */

            ctx.fillStyle = "#ffea61";

            ctx.beginPath();

            ctx.moveTo(3,-7);
            ctx.lineTo(-2,-1);
            ctx.lineTo(2,-1);
            ctx.lineTo(0,6);
            ctx.lineTo(5,-1);
            ctx.lineTo(2,-1);

            ctx.closePath();

            ctx.fill();
        }


        /* =============================================
           SHIELD
        ============================================= */

        else if(item.type === "shield"){

            ctx.fillStyle =
                "rgba(5,30,15,.8)";

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.moveTo(0,-11);

            ctx.lineTo(10,-7);

            ctx.lineTo(9,3);

            ctx.quadraticCurveTo(
                7,9,
                0,13
            );

            ctx.quadraticCurveTo(
                -7,9,
                -9,3
            );

            ctx.lineTo(-10,-7);

            ctx.closePath();

            ctx.fill();
            ctx.stroke();


            /*
                Dấu ✓
            */

            ctx.strokeStyle = "#6dffb0";
            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.moveTo(-4,0);
            ctx.lineTo(-1,3);
            ctx.lineTo(5,-4);

            ctx.stroke();
        }


        /* =============================================
           AMMO / POWER
           ICON TĂNG ĐẠN MỚI
        ============================================= */

        else if(item.type === "power"){

            /*
                Hai viên đạn nhiều màu.
                Không xoay.
            */

            /* Viên đạn trái - cyan */

            ctx.save();

            ctx.shadowBlur = 14;
            ctx.shadowColor = "#38f5ff";

            ctx.fillStyle = "#38f5ff";

            ctx.beginPath();

            ctx.moveTo(-6,-11);
            ctx.lineTo(-2,-7);
            ctx.lineTo(-2,8);
            ctx.lineTo(-6,11);
            ctx.closePath();

            ctx.fill();

            ctx.fillStyle = "#ffffff";

            ctx.beginPath();

            ctx.moveTo(-6,-11);
            ctx.lineTo(-2,-7);
            ctx.lineTo(-2,-3);
            ctx.lineTo(-6,-7);

            ctx.closePath();

            ctx.fill();

            ctx.restore();


            /* Viên đạn phải - magenta */

            ctx.save();

            ctx.shadowBlur = 14;
            ctx.shadowColor = "#ff45e6";

            ctx.fillStyle = "#ff45e6";

            ctx.beginPath();

            ctx.moveTo(2,-8);
            ctx.lineTo(6,-4);
            ctx.lineTo(6,11);
            ctx.lineTo(2,7);

            ctx.closePath();

            ctx.fill();

            ctx.fillStyle = "#ffffff";

            ctx.beginPath();

            ctx.moveTo(2,-8);
            ctx.lineTo(6,-4);
            ctx.lineTo(6,0);
            ctx.lineTo(2,-4);

            ctx.closePath();

            ctx.fill();

            ctx.restore();


            /*
                Viên đạn nhỏ ở giữa tạo điểm nhấn
            */

            ctx.fillStyle = "#ffe95c";

            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ffe95c";

            ctx.beginPath();

            ctx.arc(
                0,
                7,
                2.2,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /*
        =================================================
        SMALL ENERGY DOTS
        Các chấm bên ngoài xoay quanh vật phẩm.
        Icon bên trong vẫn đứng yên.
        =================================================
        */

        ctx.fillStyle = "#ffffff";

        ctx.shadowBlur = 8;
        ctx.shadowColor = item.color;

        for(let i=0;i<4;i++){

            const a =
                item.rotation * 1.5 +
                i * Math.PI / 2;

            const orbit =
                21 +
                Math.sin(
                    item.phase + i
                ) * 2;

            ctx.beginPath();

            ctx.arc(
                Math.cos(a) * orbit,
                Math.sin(a) * orbit,
                1.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /*
        =================================================
        LABEL
        =================================================
        */

        ctx.shadowBlur = 8;
        ctx.shadowColor = item.color;

        ctx.fillStyle = "#ffffff";

        ctx.font =
            "bold 6px Arial";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            item.label,
            0,
            25
        );


        ctx.restore();
    }
}

function drawPlayer(p){

        return;

       ================================================= */

        p.color || "#45ddff";

    const isP2 =
        mainColor.toLowerCase() === "#ff668c";

        isP2
            ? "#ff2fa4"
            : "#00aaff";

    const glowColor =
        isP2
            ? "#ff3fbd"
            : "#32eaff";


    /* =================================================
       KHIÊN
       ================================================= */

    if(p.shield > 0){

        const pulse =
            Math.sin(performance.now() * .006) * 2;

        ctx.save();

        ctx.strokeStyle = "#55ff99";

        ctx.shadowBlur = 25;
        ctx.shadowColor = "#55ff99";

    ctx.beginPath();

    ctx.ellipse(
        0,
        -9,
        5.5,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = .8;

    ctx.stroke();

    ctx.restore();


    /* =================================================
       2 ĐÈN CÁNH
       ================================================= */

    ctx.save();

    ctx.shadowBlur = 12;
    ctx.shadowColor = glowColor;

    ctx.fillStyle =
        "#ffffff";

    ctx.beginPath();

    ctx.arc(
        -18,
        13,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        18,
        13,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();


    /* =================================================
       ĐƯỜNG NĂNG LƯỢNG TRÊN THÂN
       ================================================= */

    ctx.save();

    ctx.strokeStyle =
        "#ffffff";

    ctx.shadowBlur = 10;
    ctx.shadowColor = glowColor;

    ctx.globalAlpha = .75;

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -24
    );

    ctx.lineTo(
        0,
        5
    );

    ctx.stroke();

    ctx.restore();


    /* =================================================
       HIỆU ỨNG ĐANG BẮN
       ================================================= */

    if(p.shooting){

        ctx.save();

        ctx.globalAlpha = .75;

        ctx.shadowBlur = 18;
        ctx.shadowColor =
            glowColor;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            0,
            -31,
            2.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }


    /* =================================================
       PARTICLE NHỎ QUANH TÀU
       ================================================= */

    ctx.save();

    ctx.fillStyle =
        glowColor;

    ctx.shadowBlur = 10;
    ctx.shadowColor =
        glowColor;

    const t =
        performance.now() * .002;

    for(let i=0;i<4;i++){

        const angle =
            t +
            i * Math.PI / 2;

        const radius =
            29 +
            Math.sin(
                t * 2 + i
            ) * 2;

        const x =
            Math.cos(angle) *
            radius;

        const y =
            Math.sin(angle) *
            radius;

        ctx.globalAlpha =
            .35 +
            Math.sin(
                t * 3 + i
            ) * .2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            1.2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();


    ctx.restore();
}

/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    color,
    amount
){

    if(particles.length >= MAX_PARTICLES)
        return;

    amount =
        Math.min(
            amount,
            MAX_PARTICLES-particles.length
        );

    for(let i=0;i<amount;i++){

        const angle =
            Math.random()*
            Math.PI*2;

        const speed =
            Math.random()*4+1;

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:
                22+
                Math.random()*25,

            maxLife:47,

            size:
                Math.random()*3+1,

            color
        });
    }
}


function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p = particles[i];

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.vx *= Math.pow(.97,dt);
        p.vy *= Math.pow(.97,dt);

        p.life -= dt;

        if(p.life <= 0)
            particles.splice(i,1);
    }
}


function drawParticles(){

    ctx.save();

    for(const p of particles){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/p.maxLife
            );

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =====================================================
   STARS
===================================================== */

function createStars(){

    stars = [];

    for(let i=0;i<150;i++){

        stars.push({

            x:
                Math.random()*W,

            y:
                Math.random()*H,

            size:
                Math.random()*2+.3,

            speed:
                Math.random()*1.3+.2,

            alpha:
                Math.random()*.7+.2
        });
    }
}


function updateStars(dt){

    for(const s of stars){

        s.y += s.speed*dt;

        if(s.y > H){

            s.y = -5;

            s.x =
                Math.random()*W;
        }
    }
}


function drawStars(){

    ctx.save();

    for(const s of stars){

        ctx.globalAlpha = s.alpha;

        ctx.fillStyle = "#fff";

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );
    }

    ctx.restore();
}

   BOSS PROGRESS

let bossChargeStartTime = 0;

function updateBossProgress(dt){

    if(bossState !== "charge")
        return;

    const elapsed =
        performance.now() -
        bossChargeStartTime;

    bossProgress =
        Math.min(
            1,
            elapsed/
            BOSS_CHARGE_DURATION
        );

    updateBossProgressUI();

    if(bossProgress >= 1){

        bossProgress = 1;

        bossState = "waiting";

        showBossWarning();
    }
}


function updateBossProgressUI(){

    const percent =
        Math.floor(
            bossProgress*100
        );

    document.getElementById(
        "bossProgressText"
    ).textContent =
        percent+"%";

    const circle =
        document.getElementById(
            "bossProgressCircle"
        );

    const circumference = 138.23;

    circle.style.strokeDasharray =
        circumference;

    circle.style.strokeDashoffset =
        circumference -
        circumference*
        bossProgress;

    if(percent >= 80){

        circle.style.stroke = "#ff315f";

        circle.style.filter =
            "drop-shadow(0 0 5px #ff315f)";
    }
    else{

        circle.style.stroke = "#36e0ff";

        circle.style.filter =
            "drop-shadow(0 0 5px #36e0ff)";
    }
}

/* =====================================================
   RANDOM BOSS SELECTION
===================================================== */

function chooseRandomBoss(){

    let index;

    /*
        Không cho boss mới giống boss vừa chết.
        Từ boss thứ 2 trở đi,
        random trong 40 boss.
    */

    do{

        index =
            Math.floor(
                Math.random()*
                bossTypes.length
            );

    }
    while(
        index === previousBossIndex &&
        bossTypes.length > 1
    );

    previousBossIndex = index;

    return index;
}


/* =====================================================
   SPAWN BOSS
===================================================== */

function spawnBoss(){

    if(bossState === "active")
        return;

    bossState = "active";

    bossIndex =
        chooseRandomBoss();

    const type =
        bossTypes[bossIndex];

    /*
        Boss mạnh dần theo level.
        Nhưng HP không tăng quá vô lý.
    */

    const coopMultiplier =
    player2 ? 1.55 : 1;

// Mỗi level boss tăng thêm 20 HP
const finalHP =
    Math.floor(
        (type.hp + (level - 1) * 20) *
        coopMultiplier
    );


    boss = {

        type:bossIndex,

        name:type.name,

        color:type.color,

        x:W/2,

        y:-150,

        targetY:
            Math.min(
                145,
                H*.24
            ),

        radius:
            65+
            Math.min(
                20,
                level*.4
            ),

        hp:finalHP,

        maxHp:finalHP,

        speed:type.speed,

        move:type.move,

        attack:type.attack,

        shape:type.shape,

        phase:
            Math.random()*
            Math.PI*2,

        age:0,

        shootTimer:
            55+
            Math.random()*35,

        vx:
            Math.random()<.5
                ? -1
                : 1,

        flash:0
    };

    document.getElementById(
        "bossWarning"
    ).classList.remove("show");

    showBossUI();

    soundBossAppear();

    shake = 18;
}

/* =====================================================
   SMOOTH BOSS MOVEMENT
===================================================== */

function smoothMove(current,target,amount){

    return current +
        (
            target-current
        )*
        (
            1-
            Math.pow(
                1-amount,
                1
            )
        );
}


/* =====================================================
   BOSS UPDATE
===================================================== */

function updateBoss(dt){

    if(
        !boss ||
        bossState !== "active"
    )
        return;

    boss.age += dt;

    boss.phase +=
        .025*dt;

    boss.flash =
        Math.max(
            0,
            boss.flash-dt
        );

    /*
        Boss bay vào vị trí ban đầu
    */

    if(boss.y < boss.targetY){

        boss.y +=
            Math.min(
                5*dt,
                boss.targetY-boss.y
            );

    }
    else{

        const centerX = W/2;

        const range =
            Math.min(
                W*.36,
                330
            );

        let targetX =
            centerX;

        let targetY =
            boss.targetY;

        /*
            0 - WAVE
        */

        if(boss.move === 0){

            targetX =
                centerX+
                Math.sin(
                    boss.age*.018
                )*
                range;

            targetY =
                boss.targetY+
                Math.sin(
                    boss.age*.035
                )*28;
        }

        /*
            1 - HORIZONTAL
        */

        else if(boss.move === 1){

            targetX =
                centerX+
                Math.sin(
                    boss.age*.015*
                    boss.speed
                )*
                range;

            targetY =
                boss.targetY+
                Math.sin(
                    boss.age*.025
                )*20;
        }

        /*
            2 - CIRCLE
        */

        else if(boss.move === 2){

            targetX =
                centerX+
                Math.sin(
                    boss.age*.024
                )*
                range;

            targetY =
                boss.targetY+
                Math.cos(
                    boss.age*.038
                )*55;
        }

        /*
            3 - ZIGZAG
        */

        else if(boss.move === 3){

            targetX =
                centerX+
                Math.sin(
                    boss.age*.045
                )*
                range;

            targetY =
                boss.targetY+
                Math.sin(
                    boss.age*.075
                )*40;
        }

        /*
            4 - FLOAT
        */

        else if(boss.move === 4){

            targetX =
                centerX+
                Math.cos(
                    boss.age*.012
                )*
                range;

            targetY =
                boss.targetY+
                Math.sin(
                    boss.age*.055
                )*70;
        }

        /*
            5 - AGGRESSIVE
        */

        else if(boss.move === 5){

            targetX =
                centerX+
                Math.sin(
                    boss.age*.03
                )*
                range;

            targetY =
                boss.targetY+
                Math.sin(
                    boss.age*.065
                )*85;
        }

        /*
            Smooth damping.
            Không còn nhảy vị trí.
        */

        const follow =
            .075+
            boss.speed*.012;

        boss.x =
            smoothMove(
                boss.x,
                targetX,
                Math.min(.14,follow)
            );

        boss.y =
            smoothMove(
                boss.y,
                targetY,
                .08
            );

        /*
            Clamp
        */

        boss.x =
            Math.max(
                boss.radius,
                Math.min(
                    W-boss.radius,
                    boss.x
                )
            );
    }

    boss.shootTimer -= dt;

    if(boss.shootTimer <= 0){

        bossAttack();

        const difficulty =
            Math.min(
                level*1.5,
                30
            );

        boss.shootTimer =
            Math.max(
                28,
                78-
                difficulty-
                boss.speed*7
            );
    }

    updateBossHPUI();
}


/* =====================================================
   BOSS ATTACK
===================================================== */

function bossAttack(){

    if(
        !boss ||
        bossState !== "active"
    )
        return;

    soundBossShoot();

    const attack =
        boss.attack;

    /*
        SPREAD
    */

    if(attack === "spread"){

        const count = 7;

        for(let i=0;i<count;i++){

            const angle =
                Math.PI/2+
                (
                    i-
                    (count-1)/2
                )*.20;

            createEnemyBullet(
                boss.x,
                boss.y+30,
                angle,
                4.0+
                level*.035,
                boss.color,
                6
            );
        }
    }

    /*
        SPIRAL
    */

    else if(attack === "spiral"){

        const count = 8;

        for(let i=0;i<count;i++){

            const angle =
                boss.phase+
                i*
                Math.PI*2/count;

            createEnemyBullet(
                boss.x,
                boss.y,
                angle,
                3.2+
                level*.025,
                boss.color,
                6
            );
        }
    }

    /*
        RING
    */

    else if(attack === "ring"){

        const count = 14;

        for(let i=0;i<count;i++){

            const angle =
                i*
                Math.PI*2/count+
                boss.phase*.25;

            createEnemyBullet(
                boss.x,
                boss.y,
                angle,
                2.8+
                level*.02,
                boss.color,
                5
            );
        }
    }

    /*
        AIM
    */

    else if(attack === "aim"){

        const players =
            player2
                ? [player1,player2]
                : [player1];

        for(const p of players){

            if(!p || !p.alive)
                continue;

            const angle =
                Math.atan2(
                    p.y-boss.y,
                    p.x-boss.x
                );

            createEnemyBullet(
                boss.x,
                boss.y+25,
                angle,
                5+
                level*.03,
                boss.color,
                7
            );

            /*
                Hai viên phụ tạo cảm giác
                boss đang "aim" nhưng
                không spam quá nhiều.
            */

            createEnemyBullet(
                boss.x,
                boss.y+25,
                angle-.10,
                4.2,
                boss.color,
                5
            );

            createEnemyBullet(
                boss.x,
                boss.y+25,
                angle+.10,
                4.2,
                boss.color,
                5
            );
        }
    }

    /*
        CROSS
    */

    else if(attack === "cross"){

        const angles = [
            0,
            Math.PI/2,
            Math.PI,
            Math.PI*1.5
        ];

        for(const angle of angles){

            createEnemyBullet(
                boss.x,
                boss.y,
                angle+
                boss.phase*.08,
                4,
                boss.color,
                7
            );
        }
    }
}


/* =====================================================
   CREATE ENEMY BULLET
===================================================== */

function createEnemyBullet(
    x,
    y,
    angle,
    speed,
    color,
    radius
){

    if(
        enemyBullets.length >=
        MAX_ENEMY_BULLETS
    )
        return;

    enemyBullets.push({

        x,
        y,

        vx:
            Math.cos(angle)*
            speed,

        vy:
            Math.sin(angle)*
            speed,

        color,
        radius
    });
}


/* =====================================================
   DAMAGE BOSS
===================================================== */

function damageBoss(
    damage,
    owner,
    x,
    y
){

    if(
        !boss ||
        bossState !== "active"
    )
        return;

    boss.hp -= damage;

    boss.flash = 4;

    createParticles(
        x,
        y,
        boss.color,
        4
    );

    if(boss.hp <= 0){

        destroyBoss();
    }
    else{

        updateBossHPUI();
    }
}


/* =====================================================
   BOSS HP
===================================================== */

function updateBossHPUI(){

    if(!boss)
        return;

    const percent =
        Math.max(
            0,
            boss.hp/
            boss.maxHp
        );

    const percentText =
        Math.ceil(
            percent*100
        );

    document.getElementById(
        "bossHPText"
    ).textContent =
        percentText+"%";

    const fill =
        document.getElementById(
            "bossHPFill"
        );

    fill.style.setProperty(
        "--boss-hp-angle",
        percent*360+"deg"
    );

    if(percent > .5){

        fill.style.setProperty(
            "--boss-color",
            boss.color
        );

    }
    else if(percent > .25){

        fill.style.setProperty(
            "--boss-color",
            "#ffb347"
        );

    }
    else{

        fill.style.setProperty(
            "--boss-color",
            "#ff315f"
        );
    }
}


/* =====================================================
   BOSS BULLET COLLISION
===================================================== */

function checkBossBulletCollision(){

    if(
        !boss ||
        bossState !== "active"
    )
        return;

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b = bullets[i];

        const dx =
            b.x-boss.x;

        const dy =
            b.y-boss.y;

        const d2 =
            dx*dx+
            dy*dy;

        const radius =
            boss.radius+8;

        if(d2 < radius*radius){

            bullets.splice(i,1);

            damageBoss(
                b.damage,
                b.owner,
                b.x,
                b.y
            );

            if(!boss)
                return;
        }
    }
}


/* =====================================================
   DRAW BOSS
===================================================== */

function drawBoss(){

    if(
        !boss ||
        bossState !== "active"
    )
        return;

    ctx.save();

    ctx.translate(
        boss.x,
        boss.y
    );

    if(boss.flash > 0)
        ctx.globalAlpha = .65;

    /*
        40 boss khác nhau nhưng
        sử dụng nhiều archetype hình.
    */

    switch(boss.shape % 10){

        case 0:
            drawBossMothership();
            break;

        case 1:
            drawBossBeast();
            break;

        case 2:
            drawBossCore();
            break;

        case 3:
            drawBossDestroyer();
            break;

        case 4:
            drawBossTitan();
            break;

        case 5:
            drawBossReaper();
            break;

        case 6:
            drawBossWorm();
            break;

        case 7:
            drawBossDragon();
            break;

        case 8:
            drawBossCrystal();
            break;

        default:
            drawBossSkull();
            break;
    }

    ctx.restore();
}


/* =====================================================
   BOSS 1 - MOTHERSHIP
===================================================== */

function drawBossMothership(){

    const c = boss.color;

    ctx.shadowBlur = 30;
    ctx.shadowColor = c;

    ctx.strokeStyle = c;
    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.ellipse(
        0,
        15,
        100,
        32,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle = "#4b2b86";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        88,
        30,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = c;

    ctx.beginPath();

    ctx.ellipse(
        0,
        -14,
        38,
        27,
        0,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#63ffdb";

    ctx.fillStyle = "#63ffdb";

    ctx.beginPath();

    ctx.arc(
        0,
        -14,
        10+
        Math.sin(
            boss.age*.1
        )*3,
        0,
        Math.PI*2
    );

    ctx.fill();

    for(let i=-3;i<=3;i++){

        ctx.fillStyle =
            i%2
                ? "#52d9ff"
                : "#fff06a";

        ctx.beginPath();

        ctx.arc(
            i*24,
            9,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =====================================================
   BOSS 2 - BEAST
===================================================== */

function drawBossBeast(){

    const c = boss.color;

    ctx.shadowBlur = 35;
    ctx.shadowColor = c;

    ctx.fillStyle = "#8a164b";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        72,
        55,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle = c;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "#fff";

    ctx.beginPath();

    ctx.arc(-25,-10,12,0,Math.PI*2);
    ctx.arc(25,-10,12,0,Math.PI*2);

    ctx.fill();

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(-25,-10,5,0,Math.PI*2);
    ctx.arc(25,-10,5,0,Math.PI*2);

    ctx.fill();

    ctx.strokeStyle = c;
    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
        0,
        10,
        30,
        0,
        Math.PI
    );

    ctx.stroke();

    for(let i=0;i<6;i++){

        const x =
            -55+
            i*22;

        ctx.beginPath();

        ctx.moveTo(x,35);

        ctx.quadraticCurveTo(
            x+
            Math.sin(
                boss.age*.08+i
            )*15,
            65,
            x,
            90
        );

        ctx.stroke();
    }
}


/* =====================================================
   BOSS 3 - CORE
===================================================== */

            0,0,5,
            0,0,45

        0,
        "#fff"

    gradient.addColorStop(
        .25,
        c

        1,
        "rgba(0,0,0,0)"

    ctx.arc(
        0,
        0,
        45,
        0,
        Math.PI*2

        ctx.arc(
            Math.cos(a)*72,
            Math.sin(a)*72,
            6,
            0,
            Math.PI*2
        );

/* =====================================================
   RESET SỨC CHỨA KHI KẾT THÚC LEVEL
   ===================================================== */

function resetLevelUpgrades(){

    const players =
        player2
            ? [player1, player2]
            : [player1];

    for(const p of players){

        if(!p)
            continue;


        /* ===============================
           HỒI SINH KHI SANG LEVEL MỚI
           =============================== */

        p.alive = true;


        /* ===============================
           RESET MẠNG + SỨC CHỨA
           =============================== */

        p.hp = 3;
        p.hpMax = 5;


        /* ===============================
           RESET RAPID FIRE
           =============================== */

        p.rapid = 0;
        p.rapidMax = 600;


        /* ===============================
           RESET SHIELD
           =============================== */

        p.shield = 0;
        p.shieldMax = 600;


        /* ===============================
           RESET POWER
           =============================== */

        p.power = 0;
        p.powerMax = 600;


        /* ===============================
           RESET DAMAGE BOOST
           =============================== */

        p.damageBoost = 0;
        p.damageBoostMax = 600;


        /* ===============================
           RESET TRẠNG THÁI BẮN
           =============================== */

        p.shooting = false;
        p.cooldown = 0;
    }
}

/* =====================================================
   DESTROY BOSS
===================================================== */

function destroyBoss(){

    if(!boss)
        return;

    const deadBoss = boss;

    soundBossDeath();

    shake = 30;

    /*
        Particle explosion có giới hạn.
    */

    for(let i=0;i<7;i++){

        createParticles(

            deadBoss.x+
            (Math.random()-.5)*100,

            deadBoss.y+
            (Math.random()-.5)*70,

            deadBoss.color,

            25
        );
    }

    const players =
        player2
            ? [player1,player2]
            : [player1];

    for(const p of players){

        if(p){

            p.score +=
                1000+
                level*250;
        }
    }

    /*
        Xóa toàn bộ đạn boss.
        Tránh màn hình bị ngập bullet
        sau khi boss chết.
    */

    enemyBullets = [];

    boss = null;

hideBossUI();


/*
    Level cũ đã kết thúc.
    Xóa hiệu ứng và reset
    sức chứa về 10 giây.
*/

resetLevelUpgrades();


level++;

    document.getElementById(
        "levelDisplay"
    ).textContent =
        "LEVEL "+level;

    bossProgress = 0;

    bossState = "charge";

    bossChargeStartTime =
        performance.now();

    spawnTimer = 10;

    updateBossProgressUI();

    updateUI();

    createParticles(
        W/2,
        H/2,
        "#fff",
        60
    );
}


/* =====================================================
   SPAWNER
===================================================== */

function updateSpawner(dt){

    if(
        bossState !== "charge"
    ){

        checkBossStart();

        return;
    }

    spawnTimer -= dt;

    if(spawnTimer <= 0){

        spawnEnemy();

        spawnTimer =
            Math.max(
                9,
                32-
                level*1.4
            );
    }
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    running = false;

    soundGameOver();

    const score1 =
        player1
            ? player1.score
            : 0;

    const score2 =
        player2
            ? player2.score
            : 0;

    document.getElementById(
        "finalScore"
    ).innerHTML = `

        🚀 Player 1:
        <b>${score1}</b><br>

        🚀 Player 2:
        <b>${score2}</b><br>

        🏆 Level:
        <b>${level}</b>

    `;

    document.getElementById(
        "gameOver"
    ).style.display = "flex";
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    /*
        Không clear bằng trong suốt.
        Vẽ nền trực tiếp để giảm compositing.
    */

    ctx.fillStyle = "#020711";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    const sx =
        shake > .2
            ? (Math.random()-.5)*shake
            : 0;

    const sy =
        shake > .2
            ? (Math.random()-.5)*shake
            : 0;

    ctx.save();

    ctx.translate(
        sx,
        sy
    );

    drawStars();

    drawItems();

    drawBullets();

    drawEnemyBullets();

    drawEnemies();

    drawBoss();

    drawParticles();

    drawPlayer(player1);

    drawPlayer(player2);

    ctx.restore();
}


/* =====================================================
   MAIN LOOP
===================================================== */

function loop(time){

    if(!running){

        draw();

        return;
    }

    /*
        dt được giới hạn.
        Nếu browser bị lag một frame,
        game không nhảy quá xa.
    */

    const dt =
        Math.min(
            1.8,
            Math.max(
                .35,
                (time-lastTime)/16.67
            )
        );

    lastTime = time;

    updatePlayer(player1, 1, dt);
updatePlayer(player2, 2, dt);

updateEffectDisplay(player1, 1);
updateEffectDisplay(player2, 2);


    updateBullets(dt);

    updateEnemyBullets(dt);

    updateEnemies(dt);

    updateItems(dt);

    updateParticles(dt);

    updateStars(dt);

    updateBossProgress(dt);

    updateSpawner(dt);

    updateBoss(dt);

    checkBossBulletCollision();

    checkBossStart();

    shake *= Math.pow(.88,dt);

    draw();

    requestAnimationFrame(loop);
}

   INIT
===================================================== */

resize();

createStars();

draw();

function updateEffectDisplay(player, id) {

    updateOneEffectDisplay(
        player.shield,
        "shieldUI" + id,
        "shieldTime" + id
    );

    updateOneEffectDisplay(
        player.power,
        "powerUI" + id,
        "powerTime" + id
    );

    updateOneEffectDisplay(
        player.rapid,
        "rapidUI" + id,
        "rapidTime" + id
    );

}


function updateOneEffectDisplay(time, circleId, textId) {

    const circle =
        document.getElementById(circleId);

    const text =
        document.getElementById(textId);

    if (!circle || !text)
        return;


    if (time > 0) {

        circle.classList.add("active");

        text.textContent =
            Math.ceil(time / 60) + "s";

    } else {

        circle.classList.remove("active");

        text.textContent = "0";

    }

}

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff4de1";

    ctx.fillStyle = "#ff4de1";

    ctx.beginPath();

    ctx.arc(
        -25,
        3,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        25,
        3,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* =========================
       ĐƯỜNG VIỀN THÂN
       ========================= */

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "rgba(130,250,255,.8)";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(0,-65);
    ctx.lineTo(0,68);

    ctx.stroke();

    ctx.restore();


    /* =========================
       TÊN
       ========================= */

    ctx.save();

    ctx.textAlign = "center";

    ctx.font =
        "bold 16px Arial";

    ctx.shadowBlur = 12;
    ctx.shadowColor = "#1de9ff";

    ctx.fillStyle = "#b9faff";

    ctx.fillText(
        "⚡ PHI THUYỀN CHIẾN ĐẤU ⚡",
        W/2,
        215
    );

    ctx.restore();
}


/* Vẽ ngay khi trang tải xong */
drawBattleShip();

</script>
