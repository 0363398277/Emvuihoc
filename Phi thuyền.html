<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galaxy Shooter</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040b;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= UI ================= */

#ui{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.playerUI{
    min-width:155px;
    padding:10px 13px;
    background:rgba(4,12,23,.88);
    border:1px solid #21445c;
    border-radius:12px;
    box-shadow:0 0 18px rgba(0,200,255,.08);
}

.playerUI.p2{
    border-color:#70334d;
    text-align:right;
}

.playerName{
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
}

.p1name{
    color:#45ddff;
}

.p2name{
    color:#ff668c;
}

.row{
    display:flex;
    gap:15px;
    margin-top:6px;
}

.p2 .row{
    justify-content:flex-end;
}

.stat b{
    font-size:18px;
}

.stat small{
    display:block;
    color:#718798;
    font-size:9px;
    text-transform:uppercase;
}

#soundButton{
    position:fixed;
    right:14px;
    bottom:45px;
    z-index:20;
    width:42px;
    height:42px;
    padding:0;
    border-radius:50%;
    font-size:18px;
    background:rgba(5,15,25,.9);
}

#help{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    padding:7px 15px;
    border-radius:20px;
    background:rgba(3,10,18,.8);
    border:1px solid #183248;
    color:#8196a6;
    font-size:11px;
    pointer-events:none;
}

/* ================= SCREENS ================= */

.screen{
    position:fixed;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(1,4,10,.9);
    backdrop-filter:blur(7px);
}

.panel{
    width:min(94vw,540px);
    padding:30px;
    text-align:center;
    background:linear-gradient(145deg,#0b1c2d,#030911);
    border:1px solid #24506a;
    border-radius:20px;
    box-shadow:0 0 70px rgba(0,200,255,.13);
}

.panel h1{
    color:#53e5ff;
    font-size:36px;
    letter-spacing:4px;
    text-shadow:0 0 20px #00c8ff;
    margin-bottom:12px;
}

.panel h2{
    color:#ff5c78;
    font-size:35px;
}

.panel p{
    color:#91a6b5;
    line-height:1.6;
}

.buttons{
    display:grid;
    gap:10px;
    margin-top:22px;
}

button{
    padding:13px;
    background:#0a1b2b;
    border:1px solid #28566d;
    border-radius:10px;
    color:#6de7ff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#55ddff;
    color:#021019;
    box-shadow:0 0 20px #55ddff;
}

button span{
    display:block;
    margin-top:4px;
    color:#718b9c;
    font-size:11px;
    font-weight:normal;
}

#gameOver{
    display:none;
}

.finalScore{
    margin:20px 0;
    font-size:22px;
    line-height:1.8;
}

.hidden{
    display:none!important;
}

@media(max-width:600px){
    .playerUI{
        min-width:125px;
        padding:7px 9px;
    }

    .panel{
        padding:24px 17px;
    }

    .panel h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- ================= UI ================= -->

<div id="ui">

    <div class="playerUI">

        <div class="playerName p1name">
            🚀 PLAYER 1
        </div>

        <div class="row">

            <div class="stat">
                <small>Score</small>
                <b id="score1">0</b>
            </div>

            <div class="stat">
                <small>HP</small>
                <b id="hp1">3</b>
            </div>

        </div>

    </div>


    <div class="playerUI p2">

        <div class="playerName p2name">
            🚀 PLAYER 2
        </div>

        <div class="row">

            <div class="stat">
                <small>Score</small>
                <b id="score2">0</b>
            </div>

            <div class="stat">
                <small>HP</small>
                <b id="hp2">3</b>
            </div>

        </div>

    </div>

</div>


<button id="soundButton" title="Bật/tắt âm thanh">
    🔊
</button>


<div id="help">
    Chọn chế độ để bắt đầu
</div>


<!-- ================= START ================= -->

<div id="startScreen" class="screen">

    <div class="panel">

        <h1>GALAXY SHOOTER</h1>

        <p>
            🚀 Phi thuyền người chơi<br>
            👽 Phi thuyền người ngoài hành tinh<br>
            🦠 Virus • 🪨 Khối đá<br>
            ✨ Vật phẩm phát sáng<br>
            🔊 Có âm thanh nền và hiệu ứng chiến đấu
        </p>

        <div class="buttons">

            <button onclick="startGame('mouse')">
                🖱️ CHƠI BẰNG CHUỘT
                <span>
                    Di chuyển chuột • Giữ chuột trái để bắn
                </span>
            </button>

            <button onclick="startGame('keyboard')">
                ⌨️ CHƠI BẰNG PHÍM
                <span>
                    A/D hoặc ←/→ • Giữ SPACE để bắn
                </span>
            </button>

            <button onclick="startGame('two')">
                👥 CHẾ ĐỘ 2 NGƯỜI
                <span>
                    P1: A/D + SPACE • P2: ←/→ + ENTER/Numpad Enter
                </span>
            </button>

        </div>

    </div>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOver" class="screen">

    <div class="panel">

        <h2>GAME OVER</h2>

        <div class="finalScore" id="finalScore"></div>

        <button onclick="restartGame()">
            🚀 CHƠI LẠI
        </button>

    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;

    if(player1)
        player1.y = H - 75;

    if(player2)
        player2.y = H - 75;
}

addEventListener("resize", resize);


/* =====================================================
   AUDIO ENGINE
   Không cần file âm thanh bên ngoài
===================================================== */

let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;

let soundEnabled = true;
let musicTimer = null;
let musicStep = 0;


function initAudio(){

    if(audioCtx){

        if(audioCtx.state === "suspended")
            audioCtx.resume();

        return;

    }


    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


   masterGain =
        audioCtx.createGain();

    musicGain =
        audioCtx.createGain();

    sfxGain =
        audioCtx.createGain();


    // TĂNG ÂM LƯỢNG TẠI ĐÂY
    masterGain.gain.value = 2.0;  // Tăng âm lượng tổng lên tối đa
    musicGain.gain.value = 1.0;   // Tăng nhạc nền rõ hơn một chút
    sfxGain.gain.value = 2.0;     // Tăng tiếng nổ, bắn súng to và uy lực hơn


    musicGain.connect(masterGain);
    sfxGain.connect(masterGain);
    masterGain.connect(
        audioCtx.destination
    );


    startMusic();

}


function tone(
    frequency,
    duration,
    type="sine",
    volume=.1,
    slide=0,
    destination=sfxGain
){

    if(
        !audioCtx ||
        !soundEnabled
    )
        return;


    const now =
        audioCtx.currentTime;


    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    osc.type = type;

    osc.frequency.setValueAtTime(
        frequency,
        now
    );


    if(slide){

        osc.frequency.exponentialRampToValueAtTime(
            Math.max(
                20,
                frequency+slide
            ),
            now+duration
        );

    }


    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now+.008
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+duration
    );


    osc.connect(gain);
    gain.connect(destination);


    osc.start(now);
    osc.stop(now+duration+.02);

}


/* ================= SHOOT SOUND ================= */

function soundShoot(){

    if(!audioCtx || !soundEnabled)
        return;

    tone(
        650,
        .07,
        "square",
        .045,
        -320
    );

    tone(
        1100,
        .045,
        "triangle",
        .025,
        -400
    );

}


/* ================= HIT SOUND ================= */

function soundHit(){

    if(!audioCtx || !soundEnabled)
        return;

    tone(
        180,
        .08,
        "sawtooth",
        .055,
        90
    );

}


/* ================= EXPLOSION ================= */

function soundExplosion(big = false){

    if(!audioCtx || !soundEnabled)
        return;

    const now = audioCtx.currentTime;

    // =========================
    // BOOM TRẦM — sạch, không rè
    // =========================
    const boom = audioCtx.createOscillator();
    const boomGain = audioCtx.createGain();

    boom.type = "sine";

    boom.frequency.setValueAtTime(
        big ? 95 : 125,
        now
    );

    boom.frequency.exponentialRampToValueAtTime(
        big ? 38 : 55,
        now + (big ? 0.42 : 0.28)
    );

    boomGain.gain.setValueAtTime(
        0.0001,
        now
    );

    boomGain.gain.exponentialRampToValueAtTime(
        big ? 0.22 : 0.14,
        now + 0.015
    );

    boomGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + (big ? 0.48 : 0.32)
    );

    boom.connect(boomGain);
    boomGain.connect(sfxGain);

    boom.start(now);
    boom.stop(now + 0.5);


    // =========================
    // ÂM "PHỤP" TRUNG
    // =========================
    const mid = audioCtx.createOscillator();
    const midGain = audioCtx.createGain();

    mid.type = "triangle";

    mid.frequency.setValueAtTime(
        big ? 260 : 320,
        now
    );

    mid.frequency.exponentialRampToValueAtTime(
        90,
        now + 0.18
    );

    midGain.gain.setValueAtTime(
        0.0001,
        now
    );

    midGain.gain.exponentialRampToValueAtTime(
        big ? 0.10 : 0.07,
        now + 0.01
    );

    midGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.22
    );

    mid.connect(midGain);
    midGain.connect(sfxGain);

    mid.start(now);
    mid.stop(now + 0.25);


    // =========================
    // FLASH "POP" RẤT NGẮN
    // =========================
    const pop = audioCtx.createOscillator();
    const popGain = audioCtx.createGain();

    pop.type = "sine";

    pop.frequency.setValueAtTime(
        big ? 520 : 620,
        now
    );

    pop.frequency.exponentialRampToValueAtTime(
        180,
        now + 0.08
    );

    popGain.gain.setValueAtTime(
        0.0001,
        now
    );

    popGain.gain.exponentialRampToValueAtTime(
        big ? 0.055 : 0.04,
        now + 0.005
    );

    popGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.1
    );

    pop.connect(popGain);
    popGain.connect(sfxGain);

    pop.start(now);
    pop.stop(now + 0.12);


    // =========================
    // VANG NHẸ
    // =========================
    if(big){

        setTimeout(() => {

            if(!audioCtx || !soundEnabled)
                return;

            tone(
                150,
                0.18,
                "sine",
                0.035,
                -45
            );

        }, 90);

    }
}



/* ================= ITEM SOUND ================= */

function soundItem(){

    if(!audioCtx || !soundEnabled)
        return;


    tone(
        600,
        .08,
        "sine",
        .06,
        300
    );

    setTimeout(
        () => {

            tone(
                1000,
                .12,
                "sine",
                .06,
                250
            );

        },
        65
    );

}


/* ================= DAMAGE ================= */

function soundDamage(){

    if(!audioCtx || !soundEnabled)
        return;


    tone(
        90,
        .18,
        "sawtooth",
        .1,
        -40
    );

}


/* ================= GAME OVER ================= */

function soundGameOver(){

    if(!audioCtx || !soundEnabled)
        return;


    tone(
        330,
        .25,
        "triangle",
        .07,
        -100
    );

    setTimeout(
        () => {

            tone(
                220,
                .35,
                "triangle",
                .08,
                -100
            );

        },
        180
    );

    setTimeout(
        () => {

            tone(
                120,
                .55,
                "sawtooth",
                .08,
                -50
            );

        },
        420
    );

}


/* =====================================================
   BACKGROUND MUSIC
===================================================== */

const musicNotes = [
    110,
    138.59,
    164.81,
    138.59,
    98,
    123.47,
    146.83,
    123.47
];


function startMusic(){

    if(musicTimer)
        return;


    musicStep = 0;


    musicTimer =
        setInterval(
            () => {

                if(
                    !audioCtx ||
                    !soundEnabled
                )
                    return;


                const note =
                    musicNotes[
                        musicStep %
                        musicNotes.length
                    ];


                tone(
                    note,
                    .45,
                    "sine",
                    .045,
                    0,
                    musicGain
                );


                if(
                    musicStep%4===0
                ){

                    tone(
                        note/2,
                        .7,
                        "triangle",
                        .025,
                        0,
                        musicGain
                    );

                }


                musicStep++;

            },
            520
        );

}


function toggleSound(){

    soundEnabled =
        !soundEnabled;


    document
        .getElementById("soundButton")
        .textContent =
        soundEnabled
            ? "🔊"
            : "🔇";


    if(
        audioCtx
    ){

        masterGain.gain.value =
            soundEnabled
                ? .65
                : 0;

    }

}


document
    .getElementById("soundButton")
    .addEventListener(
        "click",
        () => {

            initAudio();
            toggleSound();

        }
    );


/* =====================================================
   GAME
===================================================== */

let running = false;
let mode = "mouse";

let wave = 1;
let spawnTimer = 0;
let alienTimer = 0;
let lastTime = 0;
let shake = 0;

let player1 = null;
let player2 = null;

let bullets = [];
let enemies = [];
let items = [];
let particles = [];
let stars = [];


/* =====================================================
   PLAYER
===================================================== */

function makePlayer(
    x,
    color
){

    return {

        x:x,
        y:H-75,

        color:color,

        hp:3,
        score:0,

        speed:7,

        cooldown:0,

        rapid:0,
        shield:0,
        power:0,

        shooting:false,
        targetX:null,

        alive:true

    };

}


/* =====================================================
   START
===================================================== */

function startGame(
    selected
){

    initAudio();

    mode = selected;

    resetGame();

    running = true;


    document
        .getElementById("startScreen")
        .classList.add("hidden");


    document
        .getElementById("gameOver")
        .style.display = "none";


    if(mode === "mouse"){

        document
            .getElementById("help")
            .textContent =
            "🖱️ Di chuyển chuột • GIỮ CLICK để bắn";

    }

    else if(mode === "keyboard"){

        document
            .getElementById("help")
            .textContent =
            "⌨️ A/D hoặc ←/→ • GIỮ SPACE để bắn";

    }

    else{

        document
            .getElementById("help")
            .textContent =
            "👥 P1: A/D + SPACE • P2: ←/→ + ENTER hoặc NUMPAD ENTER";

    }


    lastTime =
        performance.now();


    requestAnimationFrame(loop);

}


function restartGame(){

    startGame(mode);

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    bullets = [];
    enemies = [];
    items = [];
    particles = [];

    wave = 1;

    spawnTimer = 0;
    alienTimer = 100;

    shake = 0;


    player1 =
        makePlayer(
            W*.35,
            "#48e4ff"
        );


    player2 = null;


    if(mode === "two"){

        player1.x = W*.30;

        player2 =
            makePlayer(
                W*.70,
                "#ff668c"
            );

    }


    updateUI();

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    document
        .getElementById("score1")
        .textContent =
        player1
            ? player1.score
            : 0;

    document
        .getElementById("hp1")
        .textContent =
        player1
            ? player1.hp
            : 0;


    document
        .getElementById("score2")
        .textContent =
        player2
            ? player2.score
            : 0;

    document
        .getElementById("hp2")
        .textContent =
        player2
            ? player2.hp
            : 0;

}


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};

addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;


        if(
            e.code === "Space" ||
            e.code === "Enter" ||
            e.code === "NumpadEnter" ||
            e.code === "ArrowLeft" ||
            e.code === "ArrowRight"
        ){

            e.preventDefault();

        }

    }
);


addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;

    }
);


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    e => {

        if(
            running &&
            mode === "mouse" &&
            player1
        ){

            player1.targetX =
                e.clientX;

        }

    }
);


canvas.addEventListener(
    "mousedown",
    e => {

        if(
            e.button === 0 &&
            running &&
            mode === "mouse"
        ){

            player1.shooting = true;

        }

    }
);


addEventListener(
    "mouseup",
    () => {

        if(player1)
            player1.shooting = false;

    }
);


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(
    p,
    id,
    dt
){

    if(
        !p ||
        !p.alive
    )
        return;


    /* MOVEMENT */

    if(
        mode === "mouse" &&
        id === 1
    ){

        if(
            p.targetX !== null
        ){

            p.x +=
                (
                    p.targetX-p.x
                )*.14*dt;

        }

    }


    if(
        mode === "keyboard"
    ){

        if(
            keys["KeyA"] ||
            keys["ArrowLeft"]
        )
            p.x -= p.speed*dt;

        if(
            keys["KeyD"] ||
            keys["ArrowRight"]
        )
            p.x += p.speed*dt;

    }


    if(
        mode === "two"
    ){

        if(id===1){

            if(keys["KeyA"])
                p.x -= p.speed*dt;

            if(keys["KeyD"])
                p.x += p.speed*dt;

        }


        if(id===2){

            if(keys["ArrowLeft"])
                p.x -= p.speed*dt;

            if(keys["ArrowRight"])
                p.x += p.speed*dt;

        }

    }


    p.x =
        Math.max(
            28,
            Math.min(
                W-28,
                p.x
            )
        );


    /* SHOOT */

    let shoot=false;


    if(
        mode==="mouse" &&
        id===1
    ){

        shoot =
            p.shooting;

    }

    else if(
        mode==="keyboard"
    ){

        shoot =
            keys["Space"];

    }

    else if(
        mode==="two"
    ){

        if(id===1)
            shoot =
                keys["Space"];

        if(id===2)
            shoot =
                keys["Enter"] ||
                keys["NumpadEnter"];

    }


    if(shoot)
        shootPlayer(p);


    p.cooldown =
        Math.max(
            0,
            p.cooldown-dt
        );

    p.rapid =
        Math.max(
            0,
            p.rapid-dt
        );

    p.shield =
        Math.max(
            0,
            p.shield-dt
        );

    p.power =
        Math.max(
            0,
            p.power-dt
        );

}


/* =====================================================
   SHOOT
===================================================== */

function shootPlayer(p){

    if(
        !p.alive ||
        p.cooldown>0
    )
        return;


    p.cooldown =
        p.rapid>0
            ? 3
            : 8;


    soundShoot();


    const amount =
        p.power>0
            ? 3
            : 1;


    if(amount===1){

        bullets.push({

            x:p.x,
            y:p.y-27,

            vy:-14,

            owner:p,

            damage:1,

            color:p.color

        });

    }

    else{

        bullets.push({

            x:p.x-9,
            y:p.y-25,

            vy:-14,

            owner:p,

            damage:2,

            color:"#ffe066"

        });


        bullets.push({

            x:p.x,
            y:p.y-30,

            vy:-15,

            owner:p,

            damage:2,

            color:"#ffffff"

        });


        bullets.push({

            x:p.x+9,
            y:p.y-25,

            vy:-14,

            owner:p,

            damage:2,

            color:"#ffe066"

        });

    }

}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];

        b.y +=
            b.vy*dt;


        if(
            b.y<-40
        ){

            bullets.splice(i,1);

        }

    }

}


function drawBullets(){

    for(
        const b of bullets
    ){

        ctx.save();

        ctx.shadowBlur=20;
        ctx.shadowColor=b.color;

        ctx.fillStyle=b.color;

        ctx.fillRect(
            b.x-2,
            b.y-13,
            4,
            18
        );

        ctx.restore();

    }

}

/* =====================================================
   ENEMY UPDATE
===================================================== */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e =
            enemies[i];

        e.age += dt;


        if(e.type==="virus"){

            e.y +=
                e.speed*dt;

            e.x +=
                Math.sin(
                    e.age*.13+
                    e.phase
                )*3*dt;

            e.rotation +=
                .05*dt;

        }


        else if(e.type==="rock"){

            e.y +=
                e.speed*dt;

            e.x +=
                e.vx*dt;

            e.rotation +=
                e.rotationSpeed*dt;


            if(
                e.x<e.radius ||
                e.x>W-e.radius
            )
                e.vx*=-1;

        }


        else if(e.type==="alien"){

            e.x +=
                e.vx*
                e.speed*
                dt;

            e.y +=
                Math.sin(
                    e.age*.08+
                    e.phase
                )*2.2*dt;

        }


        /* PLAYER COLLISION */

        const players =
            player2
                ? [player1,player2]
                : [player1];


        let hitPlayer=false;


        for(
            const p of players
        ){

            if(
                !p ||
                !p.alive
            )
                continue;


            const dx=e.x-p.x;
            const dy=e.y-p.y;

            const distance =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                distance<
                e.radius+19
            ){

                enemies.splice(i,1);

                damagePlayer(p);

                hitPlayer=true;

                break;

            }

        }


        if(hitPlayer)
            continue;


        /* BULLET COLLISION */

        for(
            let j=bullets.length-1;
            j>=0;
            j--
        ){

            const b =
                bullets[j];


            const dx=e.x-b.x;
            const dy=e.y-b.y;

            const distance =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                distance<
                e.radius+7
            ){

                bullets.splice(j,1);

                e.hp -= b.damage;

                soundHit();


                createParticles(
                    b.x,
                    b.y,
                    e.type==="alien"
                        ? "#8d7aff"
                        : e.type==="virus"
                            ? "#ff4d91"
                            : "#aab3bb",
                    7
                );


                if(e.hp<=0){

                    destroyEnemy(
                        e,
                        b.owner
                    );

                    enemies.splice(i,1);

                }

                break;

            }

        }


        if(
            e.type==="virus" &&
            e.y>H+60
        )
            enemies.splice(i,1);


        if(
            e.type==="rock" &&
            e.y>H+80
        )
            enemies.splice(i,1);


        if(
            e.type==="alien" &&
            (
                e.x<-120 ||
                e.x>W+120
            )
        )
            enemies.splice(i,1);

    }

}


/* =====================================================
   DAMAGE
===================================================== */

function damagePlayer(p){

    if(p.shield>0){

        p.shield=0;

        soundHit();

        createParticles(
            p.x,
            p.y,
            "#55ff99",
            25
        );

        return;

    }


    p.hp--;

    shake=15;

    soundDamage();


    createParticles(
        p.x,
        p.y,
        p.color,
        30
    );


    updateUI();


    if(p.hp<=0){

        p.alive=false;

        soundExplosion(true);

    }


    if(player2){

        if(
            !player1.alive &&
            !player2.alive
        )
            endGame();

    }
    else{

        if(!player1.alive)
            endGame();

    }

}


/* =====================================================
   DESTROY ENEMY
===================================================== */

function destroyEnemy(
    e,
    owner
){

    let points=0;


    if(e.type==="virus")
        points=20;

    else if(e.type==="rock")
        points=100;

    else if(e.type==="alien")
        points=150;


    if(owner)
        owner.score+=points;


    const dropChance =
        e.type==="alien"
            ? .65
            : .35;


    if(
        Math.random()<dropChance
    ){

        spawnItem(
            e.x,
            e.y
        );

    }


    soundExplosion(
        e.type==="alien" ||
        e.type==="rock"
    );


    createParticles(
        e.x,
        e.y,
        e.type==="alien"
            ? "#8c72ff"
            : e.type==="virus"
                ? "#ff4d91"
                : "#aeb8c0",
        e.type==="rock"
            ? 35
            : 25
    );


    shake=8;


    wave =
        Math.floor(
            (
                (player1?.score||0)+
                (player2?.score||0)
            )/400
        )+1;


    updateUI();

}


/* =====================================================
   DRAW ENEMIES
===================================================== */

function drawEnemies(){

    for(
        const e of enemies
    ){

        ctx.save();

        ctx.translate(
            e.x,
            e.y
        );


        if(e.type==="virus"){

            );

        }

        else if(e.type==="rock"){

            drawAlienShip(e);

        }


        ctx.restore();

    }

}


/* =====================================================
   VIRUS
===================================================== */

function drawVirus(e){

    ctx.shadowBlur=22;
    ctx.shadowColor="#ff2e88";

    ctx.strokeStyle="#ff4d91";
    ctx.lineWidth=4;


    for(
        let i=0;
        i<10;
        i++
    ){

        const a=
            i/10*Math.PI*2;


        ctx.beginPath();

        ctx.moveTo(
            Math.cos(a)*8,
            Math.sin(a)*8
        );

        ctx.lineTo(
            Math.cos(a)*
            (e.radius+7),
            Math.sin(a)*
            (e.radius+7)
        );

        ctx.stroke();

    }


    ctx.fillStyle="#d92972";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        e.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#ff75ac";

    ctx.beginPath();

    ctx.arc(
        -4,
        -5,
        e.radius*.35,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#180714";

    ctx.beginPath();

    ctx.arc(-5,-2,3,0,Math.PI*2);
    ctx.arc(5,-2,3,0,Math.PI*2);

    ctx.fill();

}


/* =====================================================
   ROCK
===================================================== */

function drawRock(e){

    ctx.shadowBlur=18;
    ctx.shadowColor="#7d8992";

    ctx.fillStyle="#59646e";
    ctx.strokeStyle="#adb8c0";
    ctx.lineWidth=3;


    const points=9;


    ctx.beginPath();


    for(
        let i=0;
        i<points;
        i++
    ){

        const angle=
            i/points*Math.PI*2;

        const radius=
            e.radius*
            (
                .85+
                Math.sin(i*4.1)*.08+
                Math.random()*.1
            );


        const x=
            Math.cos(angle)*radius;

        const y=
            Math.sin(angle)*radius;


        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);

    }


    ctx.closePath();

    ctx.fill();
    ctx.stroke();


    ctx.fillStyle="#3d474e";


    const craters=[
        [-.3,-.2,.18],
        [.28,-.12,.13],
        [.05,.30,.16],
        [.34,.30,.09]
    ];


    for(
        const c of craters
    ){

        ctx.beginPath();

        ctx.arc(
            c[0]*e.radius,
            c[1]*e.radius,
            c[2]*e.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    if(e.hp<e.maxHp){

        const width=
            e.radius*1.5;


        ctx.fillStyle="rgba(0,0,0,.6)";

        ctx.fillRect(
            -width/2,
            -e.radius-12,
            width,
            5
        );


        ctx.fillStyle="#ff536d";

        ctx.fillRect(
            -width/2,
            -e.radius-12,
            width*
            (e.hp/e.maxHp),
            5
        );

    }

}


/* =====================================================

function drawAlienShip(e){

    ctx.lineTo(5,30);

    ctx.ellipse(

        5,
        31,
        11,
        0,
        0,

    );

    ctx.fill();


    ctx.strokeStyle="#b69cff";

    );

/* =====================================================
   ITEMS
===================================================== */

function spawnItem(
    x,
    y
){

    const types=[

        {
            type:"heal",
            color:"#42dcff",
            icon:"+"
        },

        {
            type:"rapid",
            color:"#ffe066",
            icon:"⚡"
        },

        {
            type:"shield",
            color:"#55ff99",
            icon:"◆"
        },

        {
            type:"power",
            color:"#ff6880",
            icon:"✦"
        }

    ];


    const t=
        types[
            Math.floor(
                Math.random()*
                types.length
            )
        ];


    items.push({

        x:x,
        y:y,

        radius:14,

        speed:1.7,

        phase:
            Math.random()*
            Math.PI*2,

        ...t

    });

}


/* =====================================================
   ITEMS UPDATE
===================================================== */

function updateItems(dt){

    for(
        let i=items.length-1;
        i>=0;
        i--
    ){

        const item=
            items[i];


        item.y+=
            item.speed*dt;

        item.phase+=
            .08*dt;


        const players=
            player2
                ? [player1,player2]
                : [player1];


        let collected=false;


        for(
            const p of players
        ){

            if(
                !p ||
                !p.alive
            )
                continue;


            const dx=p.x-item.x;
            const dy=p.y-item.y;

            const distance=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(distance<110){

                item.x+=
                    dx*.025*dt;

                item.y+=
                    dy*.025*dt;

            }


            if(
                distance<
                item.radius+20
            ){

                collectItem(
                    item,
                    p
                );

                items.splice(i,1);

                collected=true;

                break;

            }

        }


        if(collected)
            continue;


        if(item.y>H+40)
            items.splice(i,1);

    }

}


/* =====================================================
   COLLECT
===================================================== */

function collectItem(
    item,
    p
){

    if(item.type==="heal"){

        p.hp=
            Math.min(
                5,
                p.hp+1
            );

    }


    if(item.type==="rapid")
        p.rapid=600;


    if(item.type==="shield")
        p.shield=600;


    if(item.type==="power")
        p.power=600;


    soundItem();


    createParticles(
        p.x,
        p.y,
        item.color,
        30
    );


    updateUI();

}


/* =====================================================
   DRAW ITEMS
===================================================== */

function drawItems(){

    for(
        const item of items
    ){

        ctx.save();

        ctx.translate(
            item.x,
            item.y
        );


        const pulse=
            1+
            Math.sin(
                item.phase
            )*.18;


        ctx.shadowBlur=
            30+
            Math.sin(
                item.phase
            )*10;

        ctx.shadowColor=
            item.color;


        const gradient=
            ctx.createRadialGradient(
                0,0,2,
                0,0,32*pulse
            );


        gradient.addColorStop(
            0,
            item.color
        );

        gradient.addColorStop(
            .3,
            item.color
        );

        gradient.addColorStop(
            1,
            "transparent"
        );


        ctx.fillStyle=gradient;


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            32*pulse,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle=item.color;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            item.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle="#fff";
        ctx.lineWidth=2;

        ctx.stroke();


        ctx.shadowBlur=0;

        ctx.fillStyle="#071018";

        ctx.font=
            "bold 15px Arial";

        ctx.textAlign="center";
        ctx.textBaseline="middle";

        ctx.fillText(
            item.icon,
            0,
            1
        );


        ctx.strokeStyle=item.color;
        ctx.lineWidth=2;


        for(
            let i=0;
            i<4;
            i++
        ){

            const a=
                item.phase+
                i*Math.PI/2;


            ctx.beginPath();

            ctx.moveTo(
                Math.cos(a)*20,
                Math.sin(a)*20
            );

            ctx.lineTo(
                Math.cos(a)*28,
                Math.sin(a)*28
            );

            ctx.stroke();

        }


        ctx.restore();

    }

}

/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    color,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle=
            Math.random()*
            Math.PI*2;

        const speed=
            Math.random()*5+1;


        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            life:
                25+
                Math.random()*30,

            size:
                Math.random()*3+1,

            color:color

        });

    }

}


function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.x+=p.vx*dt;
        p.y+=p.vy*dt;


        p.vx*=.97;
        p.vy*=.97;

        p.life-=dt;


        if(p.life<=0)
            particles.splice(i,1);

    }

}


function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/50
            );

        ctx.fillStyle=p.color;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   STARS
===================================================== */

function createStars(){

    stars=[];


    for(
        let i=0;
        i<180;
        i++
    ){

        stars.push({

            x:
                Math.random()*W,

            y:
                Math.random()*H,

            size:
                Math.random()*2+.3,

            speed:
                Math.random()*1.3+.2,

            alpha:
                Math.random()*.7+.2

        });

    }

}


function updateStars(dt){

    for(
        const s of stars
    ){

        s.y+=
            s.speed*dt;


        if(s.y>H){

            s.y=-5;

            s.x=
                Math.random()*W;

        }

    }

}


function drawStars(){

    for(
        const s of stars
    ){

        ctx.globalAlpha=s.alpha;

        ctx.fillStyle="#fff";

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   SPAWNER
===================================================== */

function updateSpawner(dt){

    spawnTimer-=dt;
    alienTimer-=dt;


    if(spawnTimer<=0){

        spawnEnemy();


        spawnTimer=
            Math.max(
                12,
                32-wave*1.1
            );

    }


    if(alienTimer<=0){

        spawnAlienShip();


        alienTimer=
            Math.max(
                120,
                350-wave*10
            );

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    soundGameOver();


    const score1=

            ? player1.score

    const score2=
        player2
            ? player2.score
            : 0;


    document
        .getElementById("finalScore")
        .innerHTML=
        `
        🚀 Player 1:
        <b>${score1}</b><br>
        🚀 Player 2:

        `;


    document
        .getElementById("gameOver")
        .style.display="flex";

}

   DRAW

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const sx=
        (Math.random()-.5)*shake;

    const sy=
        (Math.random()-.5)*shake;


    ctx.save();

    ctx.translate(
        sx,
        sy
    );


    ctx.fillStyle="#020711";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawStars();

    drawItems();

    drawBullets();

    drawEnemies();

    drawParticles();

    drawPlayer(player1);

    drawPlayer(player2);


    ctx.restore();

}


/* =====================================================
   MAIN LOOP
===================================================== */

function loop(time){

    if(!running){

        draw();

        return;

    }


    const dt=
        Math.min(
            2,
            (time-lastTime)/16.67
        );


    lastTime=time;


    updatePlayer(
        player1,
        1,
        dt
    );


    updatePlayer(
        player2,
        2,
        dt
    );


    updateBullets(dt);

    updateEnemies(dt);

    updateItems(dt);

    updateParticles(dt);

    updateStars(dt);

    updateSpawner(dt);


    shake*=.88;


    draw();


    requestAnimationFrame(loop);

}


/* =====================================================
   INIT
===================================================== */

resize();

createStars();

draw();

</script>

</body>
</html>
